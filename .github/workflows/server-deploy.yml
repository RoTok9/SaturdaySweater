name: deploy league server
# Deploys server/ to Cloudflare Workers. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   (Cloudflare "Edit Cloudflare Workers" token)
#   CLOUDFLARE_ACCOUNT_ID  (Cloudflare account id)
# Runs by hand from the Actions tab, and on every push that changes server/.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**']
concurrency:
  group: league-server-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets are set
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ "${#A}" -ne 32 ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID should be 32 characters (it is ${#A}). Check for spaces or a pasted label."
            exit 1
          fi
      - name: League server tests (normal and chaos)
        run: cd server && npm test
      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          command: deploy
          wranglerVersion: "4"
      - name: Health check
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Deployed to: $URL"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$URL/health"; then echo; echo "::notice::League server is live at $URL"; exit 0; fi
            sleep 10
          done
          echo "::error::Deployed, but $URL/health did not answer yet. Check the workers.dev subdomain is set up in the Cloudflare dashboard."
          exit 1
