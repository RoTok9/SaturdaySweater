# Codemagic builds for the mobile apps. The game itself lives in site/play;
# mobile/ is a Capacitor shell that copies it into native iOS and Android projects.
# Setup (one time, in the Codemagic web UI): add this repo, connect an App Store
# Connect API key under Settings > Integrations > Developer Portal and name it "SaturdaySweaterASC",
# and enable automatic iOS code signing for the bundle id com.saturdaysweater.app.
workflows:
  ios-testflight:
    name: iOS to TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: SaturdaySweaterASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.saturdaysweater.app
      node: 20
      xcode: latest
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: 'ios-*'
    scripts:
      - name: Install
        script: cd mobile && npm ci
      - name: Copy the game into the app
        script: cd mobile && npm run web && npx cap sync ios
      - name: Signing
        script: xcode-project use-profiles
      - name: Version and build number
        script: |
          cd mobile/ios/App
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER:-1};/g; s/MARKETING_VERSION = [0-9.]+;/MARKETING_VERSION = 1.0.0;/g" App.xcodeproj/project.pbxproj
          grep -E "CURRENT_PROJECT_VERSION|MARKETING_VERSION" App.xcodeproj/project.pbxproj
      - name: Build the IPA
        script: xcode-project build-ipa --project mobile/ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
  android-debug:
    name: Android test build
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      node: 20
      java: 17
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: 'android-*'
    scripts:
      - name: Install
        script: cd mobile && npm ci
      - name: Copy the game into the app
        script: cd mobile && npm run web && npx cap sync android
      - name: Build
        script: cd mobile/android && ./gradlew assembleDebug
    artifacts:
      - mobile/android/app/build/outputs/apk/debug/*.apk
