:root[data-theme="dark"]{ --bg:#0e1116; --surface:#171b22; --fg:#e8ebf0; --muted:#98a2b1; --line:#2a313c; --soft:#1e232c; --good:#4ec27a; --warn:#e2a04a; --bad:#ef6b63; --gold:#e0b84d; color-scheme:dark }

button{font:inherit;cursor:pointer}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--team);color:var(--team-fg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 10px;box-shadow:0 2px 10px rgba(0,0,0,.25)}

.tbtn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}

.bracket{display:flex;flex-direction:column;gap:12px}

.hero{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--team);border-radius:10px;padding:14px}

.confirmbox{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border:1px solid var(--bad);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}

.presser{border-left:5px solid var(--team)}
.pk{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}.pk.r1{background:var(--gold);color:#111}
.osteps{display:flex;flex-direction:column;gap:6px}
.ostep{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--soft)}

.ostep.todo{box-shadow:inset 3px 0 0 var(--warn)}

.ostep .sub{font-size:12px;color:var(--muted)}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--muted);opacity:.55;display:flex;flex-direction:column;gap:2px}
.ach.on{opacity:1;color:var(--fg);border:1px solid var(--team)}
.ach b{font-family:var(--display);font-size:15px}
body.flash-good{animation:flashg .5s ease-out}
body.flash-bad{animation:flashb .5s ease-out}
@keyframes flashg{0%{box-shadow:inset 0 0 0 100vmax color-mix(in srgb,var(--good) 35%,transparent)}100%{box-shadow:inset 0 0 0 100vmax transparent}}
@keyframes flashb{0%{box-shadow:inset 0 0 0 100vmax color-mix(in srgb,var(--bad) 30%,transparent)}100%{box-shadow:inset 0 0 0 100vmax transparent}}

.rivban{background:linear-gradient(90deg,var(--team),color-mix(in srgb,var(--team) 55%,#000));color:var(--team-fg);border-radius:8px;padding:10px 12px}

.imsg{--in:#e9e9eb;--in-fg:#111;--out:#1b8bff;--out-fg:#fff;background:var(--msg-bg,#fff);border:1px solid var(--line);border-radius:18px;padding:0;overflow:hidden;max-width:420px;width:100%;align-self:center;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}

const LEAGUE_KEY='gridiron-league-v1';
let LEAGUE=TEAMS.map(t=>({name:t[0],nick:t[1],conf:t[2],color:t[4]}));
function loadLeague(){try{const s=localStorage.getItem(LEAGUE_KEY);if(s){const arr=JSON.parse(s);if(Array.isArray(arr)&&arr.length===TEAMS.length)LEAGUE=arr.map((x,i)=>({name:String(x.name||TEAMS[i][0]).slice(0,28),nick:String(x.nick||TEAMS[i][1]).slice(0,24),conf:CONFS[x.conf]?x.conf:TEAMS[i][2],color:/^#[0-9a-fA-F]{6}$/.test(x.color||'')?x.color:TEAMS[i][4]}));}}catch(e){}}
function saveLeague(){try{localStorage.setItem(LEAGUE_KEY,JSON.stringify(LEAGUE));}catch(e){}}
function setTeamField(i,f,v){if(f==='name')v=String(v).trim().slice(0,28)||LEAGUE[i].name;if(f==='nick')v=String(v).trim().slice(0,24)||LEAGUE[i].nick;if(f==='color'&&!/^#[0-9a-fA-F]{6}$/.test(v))return;if(f==='conf'&&!CONFS[v])return;LEAGUE[i][f]=v;if(G){const t=G.teams[i];if(f==='conf'&&G.phase==='season')return;t[f]=v;}saveLeague();}
function applyLeaguePreset(kind){LEAGUE=TEAMS.map((t,i)=>({name:kind==='fictional'?FICTIONAL[i][0]:t[0],nick:kind==='fictional'?FICTIONAL[i][1]:t[1],conf:LEAGUE[i].conf,color:LEAGUE[i].color}));if(G)G.teams.forEach((t,i)=>{t.name=LEAGUE[i].name;t.nick=LEAGUE[i].nick;});saveLeague();}

function deserialize(str){const g=JSON.parse(str);if(g._pp){g.players={};g._pp.forEach(a=>{const p={id:a[0],n:a[1],pos:typeof a[2]==='number'?POS[a[2]]:a[2],yr:a[3],ovr:a[4],pot:a[5],team:a[6],tr:(a[7]||[]).map(t=>typeof t==='number'?TRK[t]:t)};if(a[8])Object.assign(p,a[8]);g.players[p.id]=p;});delete g._pp;g.portal=(g._portal||[]).map(id=>g.players[id]).filter(Boolean);delete g._portal;}

function genScheduleOnce(){

  G.teams.forEach(t=>{const p4=!!CONFS[t.conf].p4||t.conf==='IND';let perf=clamp(11-t.rank/8+(t.po==='champ'?1:0)+(!isUser(t)&&t.coach?(t.coach.rep-50)/100:0),1,10);if(!p4)perf=Math.min(7,perf*0.75);t.prestige=clamp(Math.round((t.prestige+(perf-t.prestige)*0.3)*10)/10,1,10);t.lastElo=t.elo;});
  // departures, progression, signees
  const signees={};G.recruits.forEach(r=>{if(r.committed!=null){(signees[r.committed]=signees[r.committed]||[]).push(r);}});
  const gone=[];const draftCands=[];

    [...t.roster].forEach(id=>{const p=P(id);let leave=false,why='';if(p.yr>=3){leave=true;why='graduated';}else if(p.yr>=1&&p.ovr>=86&&Math.random()<0.75){leave=true;why='declared for the NFL Draft';}else if(p.yr>=2&&p.ovr>=82&&Math.random()<0.4){leave=true;why='declared for the NFL Draft';}

      const room=p.pot-p.ovr;const g=Math.max(-1,room*rnd(0.25,0.5)+gauss()*1.5+bonusFor(p)+(hasT(p,'bloomer')?1.2:0)+(hasT(p,'workhorse')?0.6:0));p.ovr=clamp(Math.round(p.ovr+g),40,99);if(p.yr>=2&&Math.random()<0.3)p.pot=Math.max(p.ovr,p.pot-1);p.yr++;});
    (signees[t.id]||[]).forEach(r=>{const p={id:G.pid++,n:r.n,pos:r.pos,yr:0,ovr:r.ovr,pot:r.pot,team:t.id,stars:r.stars,tr:r.tr||rollTraits(),persona:r.persona};if(isUser(t)&&r.promise)p.promise={kind:'start',due:G.season+1};G.players[p.id]=p;t.roster.push(p.id);});

  userTeam().roster.forEach(id=>{const p=P(id);if(p.unhappy){delete p.unhappy;}});

function actReply(rec,idx){const c=rec.convo;if(!c||c.done)return;const r=c.r[idx];if(!r)return;const u=userTeam();const gain=r.v>=2?6+u.prestige*0.6+rnd(0,3):r.v>=1?3+rnd(0,2):r.v===0?1:r.v===-1?-2:-5;rec.interest[u.id]=Math.max(0,(rec.interest[u.id]||0)+dgain(gain));if(r.v>=2&&(rec.persona==='confident'||rec.persona==='competitor')&&/guy|job|first call|build around/i.test(r.t)&&!rec.promise)rec.promise='start';if(r.promise&&!rec.promise)rec.promise='start';c.done=true;c.picked=idx;c.reply=r.v>=2?(rec.persona==='quiet'?'\ud83d\udc4d':rec.persona==='confident'?'thats what i like to hear':rec.persona==='family'?'ok. my mom says thank you':rec.persona==='business'?'appreciate the straight answer':'bet. see you saturday'):r.v>=1?'ok cool':r.v===0?'ok':r.v===-1?'hm. ok':(rec.persona==='family'?'...':'wow ok');}

function renderRivalries(u){const rs=myRivals();if(!rs.length)return `<div class="card sec"><div class="eyebrow">Rivalries</div><div class="small muted">None yet. Rivalries are earned: ranked matchups, close finishes, upsets and revenge games build heat between two programs. Enough heat and the series gets a name and a permanent spot on the schedule.</div></div>`;

    const stl=a=>a.st==='star'?`Pro Bowler (${a.pb})`:a.st==='starter'?'starter':a.st==='rookie'?'rookie':'backup';
    return `<div class="card sec"><div class="row between"><h3>${esc(u.name)} in the pros</h3><span class="tiny muted">Pro pitch grade ${proGrade(u,'QB').toFixed(1)}/10</span></div><div class="grid2"><div class="stat"><div class="v">${recent.length}</div><div class="k">Drafted, last 4 years</div></div><div class="stat"><div class="v">${r1}</div><div class="k">First-rounders</div></div></div>
    ${act.length?`<div class="list">${act.slice(0,12).map(a=>`<div class="item"><div class="pk ${a.rd===1?'r1':''}">${a.rd}</div><div class="grow"><div class="nm">${a.pos} ${esc(a.n)} <span class="tiny muted">${a.s} · Rd ${a.rd}, pick ${a.pk}</span></div><div class="sub">Year ${a.yrs||1}, ${stl(a)}${a.paid?', paid':''}${a.hei?', Heisman':''}</div></div></div>`).join('')}${act.length>12?`<div class="tiny muted">and ${act.length-12} more</div>`:''}</div>`:`<div class="sub">Nobody from this program is in the league right now.</div>`}
    ${ret.length?`<div class="tiny muted" style="margin-top:6px">Retired Pro Bowlers: ${ret.map(a=>`${a.pos} ${esc(a.n)} (${a.pb})`).join(', ')}</div>`:''}</div>`;})();
  const hof=(G.hof||[]).filter(h=>h.team===u.name).length?`<div class="card sec"><h3>${esc(u.name)} Hall of Fame</h3><div class="list">${G.hof.filter(h=>h.team===u.name).reverse().map(h=>`<div class="item"><div class="grow"><div class="nm">${h.pos} ${esc(h.n)} <span class="tiny muted">${h.from}-${h.to}</span></div><div class="sub">${esc(h.line)} · ${h.honors.map(esc).join(', ')}</div></div></div>`).join('')}</div></div>`:'';
  const hist=G.history.length?`${rb}${recs}${hof}<div class="card sec"><h3>Dynasty history</h3><div class="tablewrap"><table><tr><th>Year</th><th>Team</th><th>Record</th><th class="r">Final</th><th>Postseason</th><th>Champion</th><th>Heisman</th><th class="r">Class</th></tr>${G.history.map(h=>`<tr><td>${h.season}</td><td>${esc(h.team)}</td><td>${h.record}${h.conf?' <span class="tag good">CC</span>':''}</td><td class="r">#${h.rank}</td><td>${esc(h.po)}</td><td>${esc(h.champ)}</td><td>${esc(h.heis||'')}</td><td class="r">${h.cls?'#'+h.cls:''}</td></tr>`).join('')}</table></div></div>`:'';
  const coach=`<div class="card sec"><div class="eyebrow">Head coach</div><h2>${esc(c.name)}</h2><div class="grid2"><div class="stat"><div class="v">${c.w}-${c.l}</div><div class="k">Career record</div></div><div class="stat"><div class="v">${c.rep}</div><div class="k">Reputation</div></div><div class="stat"><div class="v">${c.titles}</div><div class="k">National titles</div></div><div class="stat"><div class="v">${c.playoffs}</div><div class="k">Playoff trips</div></div></div>
    <div class="meter"><span class="small" style="width:70px">Hot seat</span><div class="bar grow"><i class="${seatCls}" style="width:${c.seat}%"></i></div><span class="small num">${c.seat}</span></div><div class="tiny muted">Year ${c.years} at ${esc(u.name)}. The AD expects about ${Math.round(expectedWins(u))} wins; fall short and the seat heats up, exceed it and better jobs call. Prestige ${u.prestige}/10. Difficulty: ${G.diff||'normal'}.${G.losingRun?` <b class="no">${G.losingRun} losing season${G.losingRun>1?'s':''} in a row; three means you are out.</b>`:''}</div></div>`;
  const press=`<div class="card sec"><h3>Public standing</h3>${renderApproval(false)}<div class="tiny muted">League perception (media + athletic dept) is <b>${perception()}</b>. Below 45 and other programs stop calling, however many games you win. Fans and the AD feed the hot seat; the locker room drives development and who leaves for the portal.</div>
    ${(G.pressLog||[]).length?`<div class="eyebrow">Recent pressers</div><div class="list">${G.pressLog.slice(0,6).map(x=>`<div class="item" style="flex-direction:column;align-items:flex-start;gap:3px"><div class="tiny muted">${x.s} ${x.w<=14?'Wk '+x.w:'Post'} · “${esc(x.q)}”</div><div class="small"><b>You:</b> ${esc(x.a)}</div><div class="tiny muted">${esc(x.r)} ${Object.entries(x.fx).filter(([k,v])=>v).map(([k,v])=>`<span class="${v>0?'ok':'no'}">${({fans:'Fans',locker:'Locker',admin:'AD',media:'Media'})[k]} ${v>0?'+':''}${v}</span>`).join(' ')}</div></div>`).join('')}</div>`:''}</div>`;
  const league=`<div class="card sec"><div class="row between"><h3>League editor</h3><button class="btn sm ghost" data-act="leaguetoggle">${UI.leagueOpen?'Hide':'Open'}</button></div><div class="tiny muted">Rename schools, nicknames and colors mid-dynasty. Changes carry into future dynasties too.</div>${UI.leagueOpen?renderLeagueEditor():''}</div>`;
  const achs=(()=>{const a=achGet();const n=Object.keys(a).filter(k=>ACH.some(x=>x[0]===k)).length;return `<div class="card sec"><div class="row between"><h3>Achievements</h3><span class="tag">${n}/${ACH.length}</span></div><div class="tiny muted">Earned across every dynasty on this device.</div><div class="achgrid">${ACH.map(([id,t,d])=>`<div class="ach ${a[id]?'on':''}" title="${esc(d)}"><b>${esc(t)}</b><span>${a[id]?esc(d)+(a[id]!==true?' · '+a[id]:''):'Locked'}</span></div>`).join('')}</div></div>`;})();
  const danger=`<div class="card sec"><h3>Save &amp; settings</h3><div class="tiny muted">Progress saves automatically on this device.</div>
    <div class="btnrow"><button class="btn sm ghost" data-act="fxtoggle">Sound &amp; effects: ${fxOn()?'on':'off'}</button></div>${UI.confirm==='reset'?`<div class="confirmbox"><b>Delete this dynasty?</b> Other saved dynasties are not affected.<div class="btnrow"><button class="btn sm danger" data-act="resetyes">Yes, delete it</button><button class="btn sm ghost" data-act="cancel">Keep playing</button></div></div>`:`<div class="btnrow"><button class="btn sm ghost" data-act="switch">Switch or start another dynasty</button><button class="btn sm ghost" data-act="reset">Delete this dynasty</button></div>`}</div>`;
  return coach+offers+profile+staff+press+lobby+budget+ident+pros+hist+achs+league+danger;
}

/* ===================== EVENTS ===================== */
function onAction(act,el){
  const id=el.dataset.id;const rec=id!=null?G&&G.recruits.find(r=>r.id===+id):null;
  switch(act){
    case 'pick':UI.pickTeam=+id;{const inp=document.getElementById('coachName');if(inp)UI.coachName=inp.value;}break;
    case 'diff':UI.diff=id;break;
    case 'start':{const inp=document.getElementById('coachName');const nm=(inp&&inp.value.trim())||'Coach';if(UI.pickTeam==null)return;newDynasty(UI.pickTeam,nm,UI.diff||'normal');UI.tab='home';save();break;}
    case 'tab':if(UI.live)endLive();UI.tab=id;UI.confirm=null;window.scrollTo(0,0);break;
    case 'sim':if(fxOn())ac();if(UI.live)endLive();if(G.phase==='season'){const u0=userTeam();const snap={w:u0.w,l:u0.l,cw:u0.cw,cl:u0.cl,rank:u0.rank,rw:u0.rw||0,rl:u0.rl||0,confChamp:u0.confChamp,week:G.week};const hasGame=G.games.some(x=>x.week===G.week&&!x.played&&(x.home===G.user||x.away===G.user));simWeek();const lg=hasGame?G.games.find(x=>x.week===snap.week&&x.played&&x.box&&(x.home===G.user||x.away===G.user)):null;if(lg)startLive(lg,snap);}else if(G.phase==='postseason'){runOffseason();UI.tab='home';}else startNextSeason();break;
    case 'liveskip':if(UI.live){UI.live.shown=UI.live.feed.length;UI.live.done=true;clearTimeout(liveTimer);}break;
    case 'livedone':endLive();UI.tab='home';window.scrollTo(0,0);break;
    case 'livebox':endLive();UI.tab='home';startWatch(+id);if(UI.watch){UI.watch.shown=9999;UI.watch.playing=false;clearTimeout(watchTimer);}break;
    case 'rmine':UI.rMine=!UI.rMine;break;
    case 'rsort':UI.rSort=UI.rSort==='odds'?null:'odds';break;
    case 'leadmine':UI.leadMine=!UI.leadMine;break;
    case 'planoff':G.plan.off=id;break;
    case 'hire':actHire(+id);break;
    case 'schedpick':{const [k,i]=id.split(':');actSchedPick(k,+i);break;}
    case 'schedundo':actSchedUndo(+id);break;
    case 'extend':actExtend(id);break;
    case 'planagg':G.plan.agg=id;break;
    case 'scoutopp':{const g=G.games.find(x=>x.id===+id);if(g)actScoutOpp(g);break;}
    case 'callall':actCallAll();break;
    case 'scoutall':actScoutAll();break;
    case 'rstars':UI.rStars=+id;break;
    case 'rpos':UI.rPos=id;break;
    case 'ropen':UI.rOpen=UI.rOpen===+id?null:+id;UI.pitchOpen=null;break;
    case 'offer':actOffer(rec);break;
    case 'call':actCall(rec);break;
    case 'scout':actScout(rec);break;
    case 'text':actText(rec);break;
    case 'reply':actReply(rec,+el.dataset.i);break;
    case 'dinner':actVisitAnswer(rec,+el.dataset.i);break;
    case 'pin':actPin(+id);break;
    case 'pitchopen':UI.pitchOpen=UI.pitchOpen===+id?null:+id;break;
    case 'pitch':actPitch(rec,el.dataset.key);UI.pitchOpen=null;break;
    case 'hold':actHold(rec,el.dataset.kind);break;
    case 'spring':springGame();break;
    case 'visit':actVisitStart(rec);break;
    case 'nil':actNIL(rec,+el.dataset.amt);break;
    case 'rosterpos':UI.rosterPos=id;UI.confirm=null;break;
    case 'cut':UI.confirm='cut'+id;break;
    case 'cutyes':actCut(+id);UI.confirm=null;break;
    case 'autotrim':actAutoTrim();break;
    case 'toggleportal':UI.showPortal=!UI.showPortal;break;
    case 'portal':actPortalAdd(+id);break;
    case 'confsel':UI.confSel=el.value;break;
    case 'booster':actBooster();break;
    case 'media':actMedia();break;
    case 'adlobby':actADLobby();break;
    case 'upgrade':actUpgrade(id);break;
    case 'nilinvest':actNILInvest();break;
    case 'job':UI.confirm='job'+id;break;
    case 'jobyes':acceptOffer(+id);UI.confirm=null;break;
    case 'reset':UI.confirm='reset';break;
    case 'resetyes':deleteSlot(SLOT);UI.confirm=null;UI.pickTeam=null;break;
    case 'switch':closeDynasty();UI.confirm=null;UI.pickTeam=null;UI.tab='home';break;
    case 'open':openSlot(id).then(ok=>{if(ok){UI.tab='home';UI.confirm=null;}render();});return;
    case 'delslot':UI.confirm='del'+id;break;
    case 'delslotyes':deleteSlot(id);UI.confirm=null;break;
    case 'cancel':UI.confirm=null;break;
    case 'fxtoggle':fxToggle();ac();break;
    case 'guideoff':G.guideOff=true;break;
    case 'tipseen':(G.tipsSeen=G.tipsSeen||[]).push(id);break;
    case 'realign':actRealign(id==='yes');break;
    case 'leaguetoggle':UI.leagueOpen=!UI.leagueOpen;UI.leagueIO=null;break;
    case 'leaguepreset':applyLeaguePreset(id);break;
    case 'leagueio':UI.leagueIO=id||null;UI.leagueMsg='';break;
    case 'leaguecopy':{const ta=document.getElementById('leagueText');if(ta){const txt=ta.value;(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).catch(()=>{ta.focus();ta.select();});}return;}
    case 'leagueapply':{const ta=document.getElementById('leagueText');UI.leagueMsg=importLeague(ta?ta.value:'');if(!UI.leagueMsg)UI.leagueIO=null;break;}
    case 'leagueq':UI.leagueQ=el.value;return;
    case 'leagueconf':UI.leagueConf=el.value;break;
    case 'tedit':setTeamField(+id,el.dataset.f,el.value);if(el.dataset.f!=='conf')return;break;
    case 'press':answerPresser(+id);break;
    case 'event':answerEvent(+id);break;
    case 'watch':if(UI.watch&&UI.watch.gid===+id){UI.watch=null;clearTimeout(watchTimer);}else startWatch(+id);break;
    case 'watchskip':if(UI.watch){UI.watch.shown=9999;UI.watch.playing=false;clearTimeout(watchTimer);}break;
    case 'watchreplay':startWatch(+id);break;
  }
  if(G)save();
  render();
}
async function boot(data){loadLeague();
  if(data&&data.G){G=data.G;SLOT=data.SLOT||null;migrate();if(data.UI)Object.assign(UI,data.UI);if(!SLOT)save();}else await load();
  app.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||['SELECT','INPUT','TEXTAREA'].includes(el.tagName))return;onAction(el.dataset.act,el);});
  app.addEventListener('input',e=>{const el=e.target.closest('[data-act="leagueq"]');if(el){UI.leagueQ=el.value;const box=document.getElementById('leagueList');if(box)box.innerHTML=renderLeagueRows();}});
  app.addEventListener('change',e=>{const el=e.target.closest('[data-act]');if(el)onAction(el.dataset.act,el);});
  render();
}
if(typeof window!=='undefined'&&app){boot({});}
if(typeof module!=='undefined'){module.exports={newDynasty,simWeek,runOffseason,startNextSeason,get:()=>G,T,userTeam,actOffer,actCall,actVisitStart,actVisitAnswer,actText,actReply,actPitch,actNIL,actAutoTrim,teamOvr,userCommits};}
</script>
