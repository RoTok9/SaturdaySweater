<html lang="en">
<head>

<link rel="icon" href="../icon.png">

<title>Saturday Sweater</title>

<style>
html{background:var(--bg)}
img{max-width:100%}[hidden]{display:none!important}
/* Layout: one-column sports-app shell. Team-colored masthead with the sim control, scrolling content, fixed bottom tab bar. */
:root{
  --bg:#e9ecf0; --surface:#ffffff; --fg:#12161b; --muted:#5b6673; --line:#d6dbe2; --soft:#f1f3f6;
  --good:#1d7a3e; --warn:#b2670f; --bad:#b3261e; --gold:#b8860b;
  --team:#1f3a5f; --team-fg:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --varsity:"Graduate","Barlow Condensed",Impact,sans-serif;
  --amber:#ffb000;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0d1014; --surface:#161a20; --fg:#e8ebf0; --muted:#98a2b1; --line:#2a313c; --soft:#1e232c; --good:#4ec27a; --warn:#e2a04a; --bad:#ef6b63; --gold:#e0b84d; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#0d1014; --surface:#161a20; --fg:#e8ebf0; --muted:#98a2b1; --line:#2a313c; --soft:#1e232c; --good:#4ec27a; --warn:#e2a04a; --bad:#ef6b63; --gold:#e0b84d; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--team)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
h2{font-size:24px;font-weight:700;letter-spacing:.01em}
h3{font-size:18px;font-weight:700}
button{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--team);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--team);color:var(--team-fg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 10px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.top-in{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.tname{font-family:var(--display);font-size:26px;font-weight:800;line-height:1;letter-spacing:.01em}
.tsub{font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.rec{text-align:right;flex:0 0 auto;min-width:max-content}
.rec .big{font-family:var(--display);font-size:28px;font-weight:800;line-height:1}
.rec .small{font-size:12px;opacity:.85}
.top-bar{display:flex;gap:8px;align-items:center;margin-top:10px}
.top-bar .pills{display:flex;gap:8px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:2px 0;mask-image:linear-gradient(90deg,#000 88%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
.top-bar .pills::-webkit-scrollbar{display:none}
.top-bar .pill{flex:none}
.simbtn{flex:none}
.pill{font-size:12px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.18);white-space:nowrap;border:0;color:inherit;font:inherit;font-size:12px}
.pill b{font-family:var(--display);font-size:14px;font-weight:700}
.pill.alert{background:var(--team-fg);color:var(--team);font-weight:600}
.pill.dim{opacity:.7}
.tl{display:flex;gap:3px;margin-top:10px;align-items:flex-end}
.tl .wk{flex:1;height:7px;border-radius:2px;background:rgba(255,255,255,.22);min-width:0}
.tl .wk.W{background:#39c46b}.tl .wk.L{background:#ff6b5c}.tl .wk.bye{background:rgba(255,255,255,.1)}
.tl .wk.now{height:12px;background:var(--team-fg);box-shadow:0 0 0 1px var(--team-fg)}
.tl .gap{width:5px;flex:none}
.tl-lbl{display:flex;justify-content:space-between;font-size:11px;opacity:.8;margin-top:3px;text-transform:uppercase;letter-spacing:.06em}
.nextline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:8px;font-size:14px;min-width:0}
.nextline .nx{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nextline .od{white-space:nowrap;font-family:var(--display);font-weight:700;font-size:16px}
.tabs button{position:relative}
.tabs .dot{position:absolute;top:8px;right:calc(50% - 22px);width:8px;height:8px;border-radius:50%;background:var(--bad)}
:root[data-theme="light"] .top .pill, .top .pill{color:var(--team-fg)}
.top .pill.alert{color:var(--team)}
.simbtn{margin-left:auto;background:var(--team-fg);color:var(--team);border:0;border-radius:8px;padding:9px 14px;font-family:var(--display);font-size:18px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.simbtn:disabled{opacity:.5;cursor:not-allowed}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(84px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;background:none;border:0;color:var(--muted);font-family:var(--display);font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:12px 2px 10px;border-top:3px solid transparent;margin-top:-1px}
.tabs button.on{color:var(--team-accent,var(--team));border-top-color:var(--team-accent,var(--team))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.card.flat{background:transparent;border:0;padding:0}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.num{font-family:var(--display);font-weight:700}
.btn{background:var(--team);color:var(--team-fg);border:0;border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.item.clickable{cursor:pointer}
.item .nm{font-weight:600}
.item .sub{font-size:12px;color:var(--muted)}
.item.me{background:color-mix(in srgb,var(--team) 10%,transparent);margin:0 -6px;padding-left:6px;padding-right:6px;border-radius:6px}
.rk{width:30px;text-align:right;color:var(--muted);font-family:var(--display);font-weight:700;font-size:16px}
.res{font-family:var(--display);font-weight:700;font-size:17px;white-space:nowrap}
.W{color:var(--good)} .L{color:var(--bad)}
.stars{color:var(--gold);letter-spacing:-1px;white-space:nowrap;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 10px;font-size:13px}
.chip.on{background:var(--team);color:var(--team-fg);border-color:var(--team)}
.chip.good{border-color:var(--good);color:var(--good)}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:4px;background:var(--soft);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tag.good{color:var(--good)} .tag.warn{color:var(--warn)} .tag.bad{color:var(--bad)} .tag.hot{color:#ff9b6a;background:rgba(255,122,89,.12)}
.tiny.warn{color:var(--warn)} .tag.team{background:var(--team);color:var(--team-fg)}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--muted);border-radius:4px}
.bar i.me{background:var(--team)}
.bar i.good{background:var(--good)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--soft);border-radius:8px;padding:10px 12px}
.stat .v{font-family:var(--display);font-size:26px;font-weight:800;line-height:1}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:4px}
.detail{background:var(--soft);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;margin:4px 0 8px}
select,input[type=text]{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%}
.tablewrap{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
tr.me td{background:color-mix(in srgb,var(--team) 12%,transparent);font-weight:600}
.news{display:flex;flex-direction:column;gap:8px}
.news div{padding-left:10px;border-left:3px solid var(--line);font-size:14px}
.news div.hot{border-left-color:var(--team)}
.picker{display:flex;flex-direction:column;gap:14px}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tbtn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.tbtn.on{outline:2px solid var(--team)}
.tbtn .sw{width:100%;height:5px;border-radius:3px}
.tbtn b{font-family:var(--display);font-size:17px;font-weight:700;line-height:1.1}
.tbtn span{font-size:12px;color:var(--muted)}
.bracket{display:flex;flex-direction:column;gap:12px}
.bracket .rnd{display:flex;flex-direction:column;gap:6px}
.matchup{background:var(--soft);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.matchup .t{display:flex;justify-content:space-between;gap:8px}
.matchup .t.win{font-weight:700}
.matchup .seed{color:var(--muted);width:22px;display:inline-block}
.meter{display:flex;align-items:center;gap:10px}
.hero{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--team);border-radius:10px;padding:14px}
.hero .vs{font-family:var(--display);font-size:30px;font-weight:800;line-height:1}
.confirmbox{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border:1px solid var(--bad);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ok{color:var(--good)} .no{color:var(--bad)}
.presser{border-left:5px solid var(--team)}
.pk{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}.pk.r1{background:var(--gold);color:#111}
.osteps{display:flex;flex-direction:column;gap:6px}
.ostep{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--soft)}
.ostep .n{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.08em;width:34px;color:var(--muted)}
.ostep.done{opacity:.75}
.ostep.done .n{color:var(--good)}
.ostep.todo{box-shadow:inset 3px 0 0 var(--warn)}
.ostep .nm{font-weight:600}
.ostep .sub{font-size:12px;color:var(--muted)}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--muted);opacity:.55;display:flex;flex-direction:column;gap:2px}
.ach.on{opacity:1;color:var(--fg);border:1px solid var(--team)}
.ach b{font-family:var(--display);font-size:15px}
body.flash-good{animation:flashg .5s ease-out}
body.flash-bad{animation:flashb .5s ease-out}
@keyframes flashg{0%{box-shadow:inset 0 0 0 100vmax color-mix(in srgb,var(--good) 35%,transparent)}100%{box-shadow:inset 0 0 0 100vmax transparent}}
@keyframes flashb{0%{box-shadow:inset 0 0 0 100vmax color-mix(in srgb,var(--bad) 30%,transparent)}100%{box-shadow:inset 0 0 0 100vmax transparent}}
@media (prefers-reduced-motion:reduce){ body.flash-good,body.flash-bad{animation:none} }
.rivban{background:linear-gradient(90deg,var(--team),color-mix(in srgb,var(--team) 55%,#000));color:var(--team-fg);border-radius:8px;padding:10px 12px}
.rivban.feud{background:linear-gradient(90deg,#7a0d0d,#2a0404);color:#fff}
.hero.rivhero{border-left-color:var(--bad);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad) 40%,transparent)}
/* iMessage-style thread: gray incoming on the left, blue outgoing on the right, tails on the last bubble of a run */
.convo{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.imsg{--in:#e9e9eb;--in-fg:#111;--out:#1b8bff;--out-fg:#fff;background:var(--msg-bg,#fff);border:1px solid var(--line);border-radius:18px;padding:0;overflow:hidden;max-width:420px;width:100%;align-self:center;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .imsg{--in:#26262a;--in-fg:#f2f2f7;--msg-bg:#000} }
:root[data-theme="dark"] .imsg{--in:#26262a;--in-fg:#f2f2f7;--msg-bg:#000}
.imsg .hdr{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 12px 8px;border-bottom:1px solid var(--line);background:var(--msg-bg,#fff)}
.imsg .ava{width:38px;height:38px;border-radius:50%;background:linear-gradient(#9a9aa0,#6e6e73);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px}
.imsg .who{font-size:12px;color:var(--muted)}
.imsg .who b{display:block;font-size:13px;color:var(--fg);font-weight:600}
.imsg .thread{display:flex;flex-direction:column;gap:3px;padding:10px 12px 12px}
.imsg .stamp{text-align:center;font-size:11px;color:var(--muted);margin:2px 0 6px}
.imsg .bub{max-width:78%;padding:7px 12px;border-radius:18px;font-size:15px;line-height:1.3;position:relative;word-wrap:break-word}
.imsg .bub.them{background:var(--in);color:var(--in-fg);align-self:flex-start}
.imsg .bub.me{background:var(--out);color:var(--out-fg);align-self:flex-end}
.imsg .bub.them.tail::before{content:"";position:absolute;left:-6px;bottom:0;width:14px;height:14px;background:var(--in);border-bottom-right-radius:14px;clip-path:polygon(0 100%,100% 100%,100% 0)}
.imsg .bub.me.tail::before{content:"";position:absolute;right:-6px;bottom:0;width:14px;height:14px;background:var(--out);border-bottom-left-radius:14px;clip-path:polygon(100% 100%,0 100%,0 0)}
.imsg .status{align-self:flex-end;font-size:11px;color:var(--muted);margin:2px 4px 0}
.imsg .typing{align-self:flex-start;background:var(--in);border-radius:18px;padding:9px 12px;display:flex;gap:4px}
.imsg .typing i{width:7px;height:7px;border-radius:50%;background:#8e8e93;display:block}
@media (prefers-reduced-motion:no-preference){ .imsg .typing i{animation:blink 1.2s infinite} .imsg .typing i:nth-child(2){animation-delay:.2s} .imsg .typing i:nth-child(3){animation-delay:.4s} @keyframes blink{0%,60%,100%{opacity:.35}30%{opacity:1}} .imsg .bub.new{animation:pop .25s ease-out} }
.imsg .replies{display:flex;flex-direction:column;gap:6px;padding:0 12px 12px;border-top:1px solid var(--line);padding-top:10px}
.imsg .replies .answer{border-radius:18px;background:transparent;border:1.5px solid var(--out);color:var(--out);font-size:14px;padding:8px 12px}
.imsg .replies .answer:hover{background:var(--out);color:var(--out-fg)}
.imsg .replies .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.trow{gap:8px}
.tfields{display:flex;flex-direction:column;gap:4px}
.tfields input{width:100%;padding:6px 8px;font-size:14px}
.trow input[type=color]{width:34px;height:34px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--surface);flex:none}
.trow select{padding:6px;font-size:13px;flex:none}
textarea{font:inherit;font-size:12px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;resize:vertical}
.presser .q{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.15}
.answer{text-align:left;background:var(--soft);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.3}
.answer:hover{border-color:var(--team)}
.scoreline{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border-radius:8px;padding:10px 12px}
.scoreline .t{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;flex:1}
.scoreline .t .nm{font-weight:600;font-size:13px;text-align:center}
.scoreline .sc{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.scoreline .mid{font-family:var(--display);font-weight:700;color:var(--muted);white-space:nowrap}
.plays{display:flex;flex-direction:column;gap:6px;font-size:14px}
.play{padding:6px 0 6px 10px;border-left:3px solid var(--line)}
.play.mine{border-left-color:var(--team);background:color-mix(in srgb,var(--team) 8%,transparent);padding-right:6px}
.play.theirs{border-left-color:var(--bad)}
.play.qmark{border-left-color:transparent;padding-top:4px;padding-bottom:4px}
.play.mom{border-left-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent);font-weight:600;padding-right:6px}
.play.drama{font-style:italic}
.live .scoreline .sc{font-size:42px}
@media (prefers-reduced-motion:no-preference){ .item.clickable:active{opacity:.7} .play.new{animation:pop .35s ease-out} @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}} }
@media (min-width:720px){ .tabs{max-width:760px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)} }
@media (max-width:430px){ .tabs button{font-size:11px;letter-spacing:.02em;padding:12px 0 10px} .tabs .dot{right:calc(50% - 18px)} .tname{font-size:22px} .rec .big{font-size:24px} }

/* ===== Hub revamp: masthead, matchup hero, tiles, responsive shell, playoff viewer ===== */
.top{background:linear-gradient(135deg,var(--team) 0%,var(--team-dark,var(--team)) 100%);position:sticky;overflow:hidden}
.top::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(-55deg,rgba(255,255,255,.045) 0 10px,transparent 10px 26px);mask-image:linear-gradient(90deg,transparent 35%,#000 100%);-webkit-mask-image:linear-gradient(90deg,transparent 35%,#000 100%)}
.top>*{position:relative;z-index:1}
.top-wrap{max-width:1100px;margin:0 auto}
.crest{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.02em;flex:none;color:var(--team-fg)}

/* ===== Stadium Night: glow, glass, depth, motion ===== */
:root{--radius:16px;--glow:0 0 28px color-mix(in srgb,var(--team) 55%,transparent);--ease:cubic-bezier(.2,.8,.2,1)}
:root[data-theme="dark"],:root:not([data-theme="light"]){--bg:#070a10;--surface:rgba(22,27,36,.66);--soft:rgba(255,255,255,.06);--line:rgba(255,255,255,.09);--fg:#f3f5f9;--muted:#93a0b4;--good:#4ade80;--warn:#f0b35a;--bad:#ff6b6b;--gold:#f5c451}
:root[data-theme="light"]{--surface:rgba(255,255,255,.85);--soft:rgba(10,20,40,.05);--line:rgba(10,20,40,.1)}
body{background:var(--bg);background-image:radial-gradient(900px 420px at 8% -6%,color-mix(in srgb,var(--team) 38%,transparent),transparent 70%),radial-gradient(700px 500px at 100% 100%,color-mix(in srgb,var(--team) 16%,transparent),transparent 70%),radial-gradient(500px 300px at 60% 30%,rgba(255,255,255,.03),transparent 70%);background-attachment:fixed;background-repeat:no-repeat}
:root[data-theme="light"] body{background-image:radial-gradient(900px 420px at 8% -6%,color-mix(in srgb,var(--team) 22%,transparent),transparent 70%)}
.card,.hero,.olbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 14px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2)}
:root[data-theme="light"] .card,:root[data-theme="light"] .hero,:root[data-theme="light"] .olbar{box-shadow:0 10px 30px rgba(20,30,60,.08)}
.hero{border-left:1px solid var(--line)}
.hero.mu{border-left:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06),0 0 0 1px color-mix(in srgb,var(--team) 25%,transparent)}
.hero.mu.rivhero{box-shadow:0 14px 40px rgba(0,0,0,.35),0 0 40px color-mix(in srgb,var(--bad) 30%,transparent)}
.stat,.tile,.detail,.matchup,.pvm,.imsg,.confirmbox{border-radius:12px}
.stat,.tile{background:var(--soft);border:1px solid rgba(255,255,255,.04)}
.tile .gauge i,.bar i.me,.splitbar i,.meter .bar i{box-shadow:0 0 12px currentColor}
.bar i.me{box-shadow:0 0 12px color-mix(in srgb,var(--team) 70%,transparent)}
.tile .gauge i{box-shadow:0 0 10px color-mix(in srgb,var(--team) 70%,transparent)}
.tile .v{text-shadow:0 0 18px color-mix(in srgb,var(--team) 35%,transparent)}
.btn{border-radius:10px;background:linear-gradient(180deg,color-mix(in srgb,var(--team) 85%,#fff),var(--team));box-shadow:0 6px 18px color-mix(in srgb,var(--team) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s var(--ease),box-shadow .2s var(--ease),filter .2s}
.btn:hover{filter:brightness(1.08);box-shadow:0 8px 24px color-mix(in srgb,var(--team) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.ghost{background:var(--soft);box-shadow:none;border:1px solid var(--line)}
.btn.ghost:hover{background:color-mix(in srgb,var(--fg) 10%,transparent)}
.btn.danger{background:linear-gradient(180deg,#ff7a7a,#d93b3b);box-shadow:0 6px 18px rgba(217,59,59,.35)}
.chip{border-radius:999px;transition:background .15s,border-color .15s,transform .15s}
.chip.on{box-shadow:0 0 14px color-mix(in srgb,var(--team) 55%,transparent)}
.chip:active{transform:scale(.97)}
.quick button{border-radius:999px;background:var(--surface);backdrop-filter:blur(12px);transition:transform .15s var(--ease),border-color .15s}
.quick button:hover{border-color:var(--team-accent,var(--team))}
.quick button.hot{box-shadow:0 0 16px color-mix(in srgb,var(--team) 40%,transparent)}
.item{transition:background .15s}
.item.clickable:hover{background:color-mix(in srgb,var(--fg) 4%,transparent)}
/* masthead */
.top{background:linear-gradient(180deg,rgba(8,10,16,.92),rgba(8,10,16,.72));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.top::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(520px 200px at 12% 0%,color-mix(in srgb,var(--team) 40%,transparent),transparent 70%)}

/* tabs */
.tabs{background:rgba(10,12,18,.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.08)}
:root[data-theme="light"] .tabs{background:rgba(255,255,255,.85)}

.subtabs{background:var(--soft)} .subtabs button.on{background:color-mix(in srgb,var(--team) 22%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--team) 35%,transparent)}
/* versus panel glow */
.vt{border-radius:14px;clip-path:none!important;padding:14px 10px;background:radial-gradient(120% 100% at 50% 0%,color-mix(in srgb,var(--c) 90%,#fff) 0%,var(--c) 45%,color-mix(in srgb,var(--c) 65%,#000) 100%);box-shadow:0 10px 30px color-mix(in srgb,var(--c) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}

.splitbar{height:12px;border-radius:6px;gap:3px} .splitbar i{border-radius:6px;box-shadow:0 0 14px currentColor}

.bug2{background:rgba(0,0,0,.35);border-radius:14px} .bug2 .ab{box-shadow:0 0 16px color-mix(in srgb,var(--c) 60%,transparent)}
.rip{backdrop-filter:blur(12px);background:rgba(255,255,255,.92);color:#111;box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 20px color-mix(in srgb,var(--team) 35%,transparent)}
:root:not([data-theme="light"]) .rip{background:rgba(20,24,32,.9);color:#f3f5f9;border:1px solid rgba(255,255,255,.12)}
.news div.hot{box-shadow:inset 3px 0 0 var(--team-accent,var(--team)),0 0 18px color-mix(in srgb,var(--team) 12%,transparent)}
.pvt.win{box-shadow:0 0 12px rgba(74,222,128,.25)}
.imsg{box-shadow:0 10px 30px rgba(0,0,0,.4)}
/* motion */
@media (prefers-reduced-motion:no-preference){
  #app[data-anim="1"] main>*,#app[data-anim="1"] .col-main>*,#app[data-anim="1"] .col-side>*{animation:rise .45s var(--ease) both}
  #app[data-anim="1"] main>*:nth-child(2),#app[data-anim="1"] .col-main>*:nth-child(2){animation-delay:.05s}
  #app[data-anim="1"] main>*:nth-child(3),#app[data-anim="1"] .col-main>*:nth-child(3){animation-delay:.1s}
  #app[data-anim="1"] main>*:nth-child(4),#app[data-anim="1"] .col-main>*:nth-child(4){animation-delay:.15s}
  #app[data-anim="1"] .col-side>*:nth-child(1){animation-delay:.08s} #app[data-anim="1"] .col-side>*:nth-child(2){animation-delay:.14s} #app[data-anim="1"] .col-side>*:nth-child(3){animation-delay:.2s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .top .simbtn{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 22px color-mix(in srgb,var(--team) 50%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}50%{box-shadow:0 0 38px color-mix(in srgb,var(--team) 85%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}}
  .card.live{animation:none}
}

function migrate(){if(!G)return;if(!G.app)G.app={fans:60,locker:60,admin:60,media:55};if(!G.pressLog)G.pressLog=[];if(G.presser===undefined)G.presser=null;if(G.heisman===undefined)G.heisman=null;G.teams.forEach(t=>{if(!t.coach)t.coach=makeCoach(t.prestige);});Object.values(G.players).forEach(p=>{if(!p.tr)p.tr=rollTraits();});G.portal.forEach(p=>{if(!p.tr)p.tr=rollTraits();});if(!G.lh)G.lh=[];if(!G.carousel)G.carousel=[];G.recruits.forEach(r=>{if(!r.persona){r.persona=pick(Object.keys(PERSONAS));r.tr=rollTraits();r.texted=0;r.convo=null;}});if(!G.riv){G.riv={};seedRivalries();}if(!G.diff)G.diff='normal';if(G.losingRun==null)G.losingRun=0;if(!G.plan)G.plan={off:'balanced',agg:'standard'};if(!G.staff||G.staff.oc===undefined){const old=G.staff||{coach:1,recruit:1};const u=G.teams[G.user];G.staff={oc:makeCoord('oc',50+(old.coach||1)*6),dc:makeCoord('dc',50+(old.coach||1)*6),rc:makeCoord('rc',50+(old.recruit||1)*6)};G.market=G.market||[];if(!G.contract)G.contract={yrs:3,sal:Math.round((1.5+u.prestige*0.6)*10)/10};}if(!G.coach.xp)G.coach.xp={rec:0,dev:0,big:0,media:0};if(G.phase==='offseason'&&!G.schedOffers)G.schedOffers=genSchedOffers();if(!G.alumni||G.teams.some(t=>!t.drafted))seedDraftHistory();}
function news(text,hot){G.news.unshift({w:G.week,s:G.season,text,hot:!!hot});if(G.news.length>80){for(let i=G.news.length-1;i>=40&&G.news.length>80;i--){if(!G.news[i].hot)G.news.splice(i,1);}if(G.news.length>80)G.news.length=80;}}

const ROLES={oc:'Offensive coordinator',dc:'Defensive coordinator',rc:'Recruiting coordinator'};
const salaryFor=rt=>Math.round((0.3+Math.max(0,rt-40)*0.1)*10)/10;
function makeCoord(role,rt,extra){rt=clamp(Math.round(rt),40,95);return Object.assign({n:coachName(),role,rt,yrs:rint(1,3),sal:salaryFor(rt),amb:rint(1,5),age:rint(31,58)},extra||{});}
function staffBonus(){const st=G.staff||{};return {oc:st.oc?st.oc.rt:55,dc:st.dc?st.dc.rt:55,rc:st.rc?st.rc.rt:55};}

function genMarket(){const u=userTeam();const out=[];for(let i=0;i<9;i++){const role=['oc','dc','rc'][i%3];const r=Math.random();const rt=r<0.15?rint(78,90):r<0.6?rint(62,77):rint(48,61);const tag=rt>=78?'Hot name':rt<=55?'Young and cheap':Math.random()<0.4?'Veteran':'';const c=makeCoord(role,rt,{tag,yrs:rint(2,4)});c.ask=salaryFor(rt)*(rt>=78?1.25:1);c.ask=Math.round(c.ask*10)/10;out.push(c);}
  // fired head coaches also show up as coordinators
  (G.carousel||[]).slice(0,2).forEach((m,i)=>{const mm=m.match(/fires (.+?) after/);if(mm&&Math.random()<0.7){const c=makeCoord(pick(['oc','dc']),rint(66,82),{n:mm[1],tag:'Former head coach',yrs:2});c.ask=salaryFor(c.rt);out.push(c);}});
  return out;}

function actHire(idx){const c=(G.market||[])[idx];if(!c||G.phase!=='offseason')return;const cur=G.staff[c.role];const cost=cur?buyout(cur):0;if(G.budget<cost+c.ask)return;G.budget=Math.round((G.budget-cost)*10)/10;if(cur)news(`${ROLES[cur.role]} ${cur.n} let go; buyout $${cost}M.`);c.sal=c.ask;G.staff[c.role]=c;G.market.splice(idx,1);news(`${c.n} hired as ${ROLES[c.role].toLowerCase()} (${c.rt} rating, $${c.sal}M a year, ${c.yrs} years).`,true);}
function actExtend(role){const c=G.staff[role];if(!c||G.phase!=='offseason')return;const cost=1;if(G.budget<cost)return;G.budget-=cost;c.yrs+=1;c.sal=Math.round(c.sal*1.12*10)/10;c.amb=Math.max(1,c.amb-1);news(`${c.n} extended a year at $${c.sal}M.`);}
let TREE_POOL=[];
function staffDepartures(){const u=userTeam();const st=G.staff;['oc','dc','rc'].forEach(role=>{const c=st[role];if(!c)return;if(c.rt>=78&&c.amb>=3&&Math.random()<0.22+(u.rank<=15?0.15:0)){G.tree=G.tree||[];const e={n:c.n,role,rt:c.rt,left:G.season+1,from:u.name,team:null,pr:c.pr||pick(Object.keys(CPERS))};G.tree.unshift(e);if(G.tree.length>12)G.tree.length=12;TREE_POOL.push({e,own:G.user});news(`${c.n} leaves to become a head coach. You need a new ${ROLES[role].toLowerCase()}.`,true);st[role]=null;}});}

function staffOffseason(){const u=userTeam();const st=G.staff;
  ['oc','dc','rc'].forEach(role=>{const c=st[role];if(!c)return;c.yrs--;c.age++;
    // drift: good seasons grow coordinators, bad ones expose them

  });

const XP_LEVELS=[0,15,40,90,170,300];

function contractTick(){const c=G.contract;if(!c)return;c.yrs--;const u=userTeam();if(c.yrs<=0){if(G.coach.seat<45){const yrs=G.coach.seat<20?4:3;const sal=Math.round(c.sal*(G.coach.seat<20?1.3:1.15)*10)/10;G.talks={yrs,sal,base:c.sal,asked:0};c.yrs=1;news(`Your contract is up. The AD has an extension on the table: ${yrs} years at $${sal}M. Answer it on the Program tab before camp.`,true);}else{c.yrs=1;G.coach.seat=clamp(G.coach.seat+10,0,100);news(`No extension. You are coaching on the last year of your deal, and everyone knows it.`,true);}}}

function staffPreseason(){['oc','dc','rc'].forEach(role=>{const c=G.staff[role];if(!c||c.yrs<=0){if(c)news(`${c.n} walked. An interim ${ROLES[role].toLowerCase()} fills in.`);G.staff[role]=makeCoord(role,rint(46,54),{n:coachName(),yrs:1,tag:'Interim'});}});G.hoursMax=hoursFor();}
const CPERS={recruiter:{n:'Recruiter',d:'Lives on the road. Closes late and flips commits.'},gambler:{n:'Riverboat gambler',d:'Goes for it on fourth down. Wild swings either way.'},oldschool:{n:'Old school',d:'Runs it, plays defense, keeps his roster together.'},players:{n:'Players\u2019 coach',d:'Guys stay, guys play loose. Rarely loses anyone to the portal.'},showman:{n:'Showman',d:'Talks before the game. Rivalries get hotter with him around.'},schemer:{n:'Schemer',d:'Wins the chess match. Dangerous in a close one.'}};

function makeCoach(prestige){return {n:coachName(),rep:clamp(Math.round(prestige*8+rnd(-10,15)),5,95),yrs:rint(0,8),seat:rint(5,45),pr:pick(Object.keys(CPERS))};}
function coachTalk(){const g=nextGame();if(!g||G.phase!=='season')return;const o=T(g.home===G.user?g.away:g.home);const c=o.coach;if(!c)return;const pr=coachPersona(c);const u=userTeam();const R=gameRiv(g);
  if(pr==='showman'&&Math.random()<0.7){const lines=[`We did not come here to be polite. ${u.name} knows what is coming.`,`Everybody keeps asking about ${u.name}. Ask them about us.`,`I like our guys. I like them a lot more than theirs.`,`${u.nick||u.name}? We have seen that movie.`];news(`${c.n} (${o.name}) at his presser: "${pick(lines)}"`,!!R);if(R){R.heat=clamp(R.heat+3,0,100);}G.app.fans=clamp(G.app.fans+1,0,100);}
  else if(pr==='oldschool'&&R&&Math.random()<0.5)news(`${c.n} (${o.name}) closed practice this week. "This one is about toughness."`);
  else if(pr==='schemer'&&Math.random()<0.5)news(`${o.name} is installing new looks for ${u.name}, per sources. ${c.n} wins the chess match more often than not.`);}

function rollTraits(){const pool=Object.keys(TRAITS);const n=Math.random()<0.45?0:Math.random()<0.75?1:2;const out=[];while(out.length<n){const t=pick(pool);if(!out.includes(t)&&!(t==='fragile'&&out.includes('workhorse'))&&!(t==='workhorse'&&out.includes('fragile'))&&!(t==='flight'&&out.includes('homebody'))&&!(t==='homebody'&&out.includes('flight')))out.push(t);}return out;}
const hasT=(p,t)=>!!(p.tr&&p.tr.includes(t));
function makeTeams(){return TEAMS.map((t,i)=>({id:i,name:LEAGUE[i].name,nick:LEAGUE[i].nick,conf:LEAGUE[i].conf,prestige:t[3],color:LEAGUE[i].color,region:t[5],facilities:clamp(Math.round(t[3]*0.9+rnd(-1,1.5)),1,10),roster:[],elo:1200,w:0,l:0,cw:0,cl:0,rank:0,pollScore:0,confChamp:false,mediaBump:0,bowl:null,po:null,lastElo:null,titles:0,hist:[],coach:makeCoach(t[3])}));}
function makePlayer(team,pos,yr,mean){const ovr=clamp(Math.round(mean+gauss()*5+yr*2.4),40,99);const pot=clamp(Math.round(ovr+Math.max(0,3-yr)*rnd(1,5)+gauss()*3),ovr,99);const p={id:G.pid++,n:name(),pos,yr,ovr,pot,team:team.id,tr:rollTraits()};G.players[p.id]=p;team.roster.push(p.id);return p;}
function fillRoster(team,yr0Only){POS.forEach(pos=>{let c=team.roster.filter(id=>P(id).pos===pos).length;while(c<SHAPE[pos]){makePlayer(team,pos,yr0Only?0:rint(0,3),52+team.prestige*3.2);c++;}});}
function depth(team,pos,all){return team.roster.map(P).filter(p=>p.pos===pos&&(all||!(p.inj>0))&&!(p.redshirt===G.season&&!all)).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.ovr-a.ovr);}
function isStarter(p){const d=depth(T(p.team),p.pos);return d.indexOf(p)<STARTERS[p.pos];}
function unitOvr(team,list){let s=0,w=0;list.forEach(pos=>{const d=depth(team,pos);for(let i=0;i<STARTERS[pos];i++){s+=(d[i]?d[i].ovr:45)*WEIGHT[pos];w+=WEIGHT[pos];}});return s/w;}
const teamOvr=t=>unitOvr(t,POS);
function teamElo(t){const base=1000+(teamOvr(t)-60)*17+t.prestige*8;return t.lastElo==null?base:base*0.75+t.lastElo*0.25;}
const potGrade=p=>{const r=p.pot-p.ovr;return r>=14?'A':r>=9?'B':r>=5?'C':'D';};
const isUser=t=>!!G&&t.id===G.user;
const userTeam=()=>T(G.user);

/* ===================== RIVALRIES ===================== */
const rkey=(a,b)=>a<b?a+'-'+b:b+'-'+a;
function rivalry(a,b,create){const k=rkey(a,b);let r=G.riv[k];if(!r&&create){r=G.riv[k]={a:Math.min(a,b),b:Math.max(a,b),heat:0,name:'',w:{},streak:null,games:[],born:null,lastSeason:G.season};}return r;}
function rivTier(r){return RIV_TIERS.find(t=>r.heat>=t[0])[1];}
const TROPHIES=['the Iron Skillet','the Old Brass Spittoon','the Governor\u2019s Cup','the Paul Bunyan Axe','the Victory Bell','the Golden Boot','the Cannon','the Wagon Wheel','the Keg of Nails','the Bronze Boot','the Jeweled Shillelagh','the Commander-in-Chief\u2019s Hat','the Old Oaken Bucket','the Little Brown Jug','the Anvil','the River Cup','the Lumberjack Trophy','the Coal Miner\u2019s Pail','the Magnolia Bowl','the Telephone Trophy'];
function rivTrophy(){const used=new Set(Object.values(G.riv).map(r=>r.trophy).filter(Boolean));const free=TROPHIES.filter(t=>!used.has(t));return free.length&&Math.random()<0.6?pick(free):null;}
function rivName(a,b){const used=new Set(Object.values(G.riv).map(r=>r.name));const ta=T(a),tb=T(b);const cands=[];
  const thing=()=>pick(TROPHY_THINGS);
  for(let i=0;i<30;i++){const kind=rint(0,5);let n;const th=thing();
    if(kind===0)n=`The ${pick(TROPHY_ADJ)} ${th}`;else if(kind===1)n=`Battle for the ${th}`;else if(kind===2)n=`The ${th} Game`;else if(kind===3)n=`The ${REGION_NAMES[ta.region]===REGION_NAMES[tb.region]?REGION_NAMES[ta.region]:(ta.conf===tb.conf?CONFS[ta.conf].name:'Border')} ${pick(['Showdown','Brawl','Classic','War','Clash'])}`;else if(kind===4)n=`The ${pick([ta.nick,tb.nick]).split(' ').pop()} Bowl`;else n=`${pick(TROPHY_ADJ)} ${th} Trophy`;
    if(!used.has(n)){cands.push(n);break;}}

function rivUpdate(g,r){ // called after a game between the two teams
  const h=T(g.home),a=T(g.away);const hr=g.hrank||99,ar=g.arank||99;const margin=Math.abs(g.hs-g.as);
  const matters=G.riv[rkey(g.home,g.away)]||(hr<=25&&ar<=25)||margin<=7||g.type!=='reg'||(g.conf&&h.region===a.region)||isHuman(g.home)||isHuman(g.away);if(!matters)return {heat:0,games:[],w:{}};
  const R=rivalry(g.home,g.away,true);
  g.rivPre={heat:R.heat,name:R.name,w:Object.assign({},R.w),streak:R.streak?Object.assign({},R.streak):null,n:R.games.length};
  let add=1.5;if(hr<=25&&ar<=25)add+=5;if(hr<=10&&ar<=10)add+=7;if(hr<=5&&ar<=5)add+=5;if(margin<=3)add+=7;else if(margin<=7)add+=4;else if(margin<=14)add+=1;
  if(g.conf)add+=1;if(h.region===a.region)add+=1;if(g.type==='ccg')add+=6;if(g.type==='po')add+=9;
  const upset=(g.hs>g.as&&hr>ar+10)||(g.as>g.hs&&ar>hr+10);if(upset)add+=4;
  if(R.streak&&R.streak.n>=3&&R.streak.team!==r.w.id)add+=6; // revenge
  if(R.games.length<2)add*=0.6; // first meetings mean less
  const wasTier=rivTier(R);R.heat=clamp(R.heat+add,0,100);R.lastSeason=G.season;
  R.w[r.w.id]=(R.w[r.w.id]||0)+1;R.streak=R.streak&&R.streak.team===r.w.id?{team:r.w.id,n:R.streak.n+1}:{team:r.w.id,n:1};
  R.games.push({s:G.season,w:r.w.id,ws:r.ws,ls:r.ls,hr,ar,wk:g.week});if(R.games.length>8)R.games.shift();
  const tier=rivTier(R);
  const namedA=Object.values(G.riv).filter(x=>x.name&&(x.a===R.a||x.b===R.a)).length,namedB=Object.values(G.riv).filter(x=>x.name&&(x.a===R.b||x.b===R.b)).length;

  else if(tier!==wasTier&&tier==='Blood feud'){const mine=g.home===G.user||g.away===G.user;if(mine)ach('feud');news(`${R.name||h.name+'-'+a.name} is a blood feud now. Nobody in either town talks about anything else that week.`,mine);}
  return R;}

const CHANGELOG=[{"version": "1.140.0", "notes": "Hometown recruits: when a four- or five-star from your own region picks you, the local paper runs it above the fold; when he leaves for an in-region rival, the radio shows let you hear about it. Players no longer get names like Carter Carter."}, {"version": "1.139.0", "notes": "Stay or go: after the season, your draft-eligible underclassmen are deciding. You get one conversation with each: sell him on coming back to win it all (works best if you just did), put a NIL package on the table, or bless his decision and send him off with your support."}, {"version": "1.138.1", "notes": "Call buttons keep their text clear of the key-number badge on narrow screens; the scorebug reads Pregame during the locker-room speech."}, {"version": "1.138.0", "notes": "Bowl invitations: when you are headed to a bowl, the reps call and you choose where to spend December. The destination bowl (players love it), the best opponent on the board (poll points if you win), or the bowl close to home (recruits can make the drive). Then you plan the trip."}, {"version": "1.137.2", "notes": "Weather reaches crunch time: airing it out in rain or snow invites a turnover, wind and snow push field goals wide, and your coordinators factor it into their advice."}, {"version": "1.137.1", "notes": "Playbook help and website updated for pregame speeches, coordinator advice, captains, ticket prices, game-day looks and retirement."}, {"version": "1.137.0", "notes": "Locker room before kickoff: in big games (rivalries, ranked opponents, the postseason) the broadcast opens in the locker room and you pick the speech. Fire them up when it is personal or nobody believes in you, stay calm on the road and the biggest stages, or play for each other when the room is tight. The right speech wins the first half; the wrong one costs you a false start. Conference power rankings also live on Polls > Standings."}, {"version": "1.136.0", "notes": "Conference power table on Polls > Standings: every conference ranked by team strength with its ranked teams and non-conference record."}, {"version": "1.135.0", "notes": "Your game-day look: on Program pick what you wear on the sideline (the sweater, a sweater vest, quarter-zip, hoodie, suit and tie, or the visor). The broadcast notices, a winning streak in it makes the news (nobody is allowed to wash it), and changing it after a run of wins upsets the message board."}, {"version": "1.134.0", "notes": "Season archive: every finished season keeps its story and a dozen headlines from across the year (camp buzz, the big wins, the injuries, the playoff, the champion), browsable on the Program tab."}, {"version": "1.133.1", "notes": "Recruiting board tags whether you are in each prospect's top five or top three. Road wins in named rivalries sometimes end with a flag planted at midfield."}, {"version": "1.133.0", "notes": "Top-five lists: in Week 6 your four- and five-star targets cut their lists to a top five, and in Week 10 to a top three. Make the cut and you hear about it; get left off and your standing with him drops sharply, so the early weeks of recruiting matter."}, {"version": "1.132.0", "notes": "Storm the field: beat a top-10 team at home as an unranked or much lower-ranked team and the students come over the wall on the broadcast. The conference fines you 50K; the fans and any recruit on a visit that day will never forget it."}, {"version": "1.131.1", "notes": "Sellout streaks count any home crowd over 90 percent of capacity, so big programs keep theirs through cupcake games. Fresh website screenshots."}, {"version": "1.131.0", "notes": "Rushing a star back: when a top player is a week from being cleared before a big game, he wants to play. Play him at eighty percent (and risk losing him for weeks), sit him one more week, or let him make the call himself."}, {"version": "1.130.0", "notes": "Retirement: in the offseason you can retire from Program > Save and settings. Your career becomes a legacy page: a tier from Cautionary tale to Immortal, legacy score, record, titles, stops, splits and every season. Un-retire any time (nobody is surprised)."}, {"version": "1.129.0", "notes": "Broadcast variety: punt returns, kickoff returns and blocked punts for touchdowns, plus the occasional flea flicker, trick play or fourth-down strike."}, {"version": "1.128.0", "notes": "Season tab shows your strength of schedule rank nationally and how many ranked opponents are left."}, {"version": "1.127.0", "notes": "Trash talk: showman and gambler coaches now pop off on their radio shows before big games. Fire back at your presser (edge, heat, and you had better win), take the high road, or tape the quote to every locker and say nothing."}, {"version": "1.126.1", "notes": "Website feature copy updated for the latest additions."}, {"version": "1.126.0", "notes": "Sellout streaks: big programs start with a long one, every home sellout extends it (milestones make the news), the game hero shows it, and the day it ends the AD notices the empty seats in the upper deck."}, {"version": "1.125.0", "notes": "Media days poll: the season preview tells you where the conference picked you to finish (and who they picked to win it), and the season story remembers if you blew past it or fell short."}, {"version": "1.124.0", "notes": "Coordinator on the hot seat: when your defense is giving up 31 a game or the offense cannot reach 17, talk radio wants a head. Fire him (an interim takes the play sheet, fans cheer, the staff room goes quiet), take over the play-calling yourself (it works if you have big-game experience), or back him publicly."}, {"version": "1.123.0", "notes": "Ticket prices: in the offseason set Bargain, Standard or Premium under Program > Facilities. Bargain packs the stadium and the fans love you for it but the gate shrinks; Premium squeezes about a third more out of every home game and the fan base slowly sours, faster when you lose at home."}, {"version": "1.122.0", "notes": "Vote of confidence: when your projected seat runs hot in October, the AD releases the statement everyone in college football dreads. Say nothing, promise a bowl game (the seat cools now; deliver and it is forgotten, miss and you are likely done), or spend a week of recruiting time in his office with a whiteboard."}, {"version": "1.121.1", "notes": "Coach's call panels read top to bottom: the situation, then your coordinator's advice, then the options."}, {"version": "1.121.0", "notes": "The Monday column: Polls now carries a weekly power-rankings column for the top 10 with a line on every team (survived by a field goal, a statement win, the loss that lingers, who is next), so the country feels like it has opinions."}, {"version": "1.120.0", "notes": "Walk-on scholarships: most rosters now carry a walk-on who has played his way into the rotation, and midseason the staff asks whether it is time. Surprise him in front of the team (the video goes everywhere, the locker room erupts, family-first recruits notice), tell him quietly, or make him wait and risk the portal. Scholarship players earned this way carry a tag on their card."}, {"version": "1.119.0", "notes": "Keyboard: during a live game, press 1 to 5 to make the halftime, fourth-quarter or two-minute call (numbers show on the buttons on desktop). Coach profile tracks how often you follow your coordinators' advice and how it worked out."}, {"version": "1.118.0", "notes": "Single-game records: the Records card on Program now keeps the best single games of your tenure (passing yards, passing TDs, rushing yards, receiving yards, points), and breaking one makes the newswire."}, {"version": "1.117.0", "notes": "Your coordinators talk in the headset: every halftime, fourth-quarter and two-minute call now comes with a recommendation from your OC or DC, with their reasoning. Better coordinators read the game right more often; a weak one will steer you wrong sometimes."}, {"version": "1.116.0", "notes": "Committee rankings: from Week 10 the playoff committee releases its rankings every Tuesday and the newswire tells you your projected seed, whether that means a bye or a home game, and how far you moved since last week."}, {"version": "1.115.0", "notes": "Team captains: in Week 1 you name two captains from your veteran starters. Leaders make the best ones; pass over a leader and he may take it personally. Captains walk out for the coin toss on the broadcast. Skip it and the team votes. Decision day now only shows ceremonies where your hat is on the table."}, {"version": "1.114.0", "notes": "The podium asks about your calls: after a one-score game decided in the last two minutes the press wants to know about the call you made (own it, take credit, or blame the players), and hosting the pregame show brings its own question."}, {"version": "1.113.0", "notes": "The pregame show: each week the Saturday morning show picks the biggest game in the country and broadcasts from that campus. Host it and you get a bigger crowd, a small home edge, and visiting recruits who saw the whole thing; win on that weekend and the media and fans remember. It shows as a game-day tag and opens the broadcast."}, {"version": "1.112.0", "notes": "Heisman ceremony: after championship week, Home shows the finalists on the stage in New York. Tap for the envelope; vote shares appear and the winner lights up. If it is your player, confetti."}, {"version": "1.111.0", "notes": "Trophy case gets hardware: gold cups for national titles, silver for conference titles, bowl trophies, and plaques for rivalry trophies (lit when they are in your building, dimmed when they are not). Senior Day broadcasts name the seniors walking out."}, {"version": "1.110.0", "notes": "Decision day: when a four- or five-star you offered announces, Home shows the ceremony with three hats on the table. Tap to see which one he reaches for. Five-star commits to you bring the confetti."}, {"version": "1.109.3", "notes": "New app icon and social preview image in the game's look (the old ones rendered blank on some systems)."}, {"version": "1.109.2", "notes": "Website: scorebug layout on phones."}, {"version": "1.109.1", "notes": "Website: scorebug fits on phones; fresh Home screenshot."}, {"version": "1.109.0", "notes": "Website redesigned in the game's own language: stadium-night glass cards, condensed display type, a working miniature of the live broadcast in the hero (two-minute drill, ball tracking, win chance, the coach's call), a Game day section built around the three calls, the season track, co-op, fresh screenshots (crunch time, conference race) and a What's new section fed by the changelog. In the game, the two-minute marker now shows the ball with the right team."}, {"version": "1.108.0", "notes": "Package deals: some recruits from the same region want to play together. The board tags them (package with WR X), and when one commits, the school he picked jumps to the top of his friend's list, so landing one can land two, and losing one can cost you both."}, {"version": "1.107.0", "notes": "Clinching scenarios: in the last three weeks the Conference race card and the newswire spell out exactly what you need (You are in if you win Saturday and BYU loses to Utah), computed from every possible outcome of the remaining conference games. Career milestones: 50, 100, 150 and 200 wins, multiple titles and long tenures get their moment in the news."}, {"version": "1.106.0", "notes": "Career stops: when you change jobs the game records the tenure (seasons, record, best finish, conference titles, playoffs, national titles), the departure news carries it, and a Career stops card in Program keeps the list."}, {"version": "1.105.0", "notes": "Bug reporting: Program > Save and settings has a Copy diagnostics button that puts the version, where you are in the season, the last 30 actions and any recent errors on the clipboard so you can paste them into a bug report."}, {"version": "1.104.0", "notes": "Coach background on the start screen: Walk-on, Recruiter, Developer, Big-game or CEO. Each starts you at level 1 of that track, so your coach has an identity from day one."}, {"version": "1.103.0", "notes": "Career splits on the coach profile: vs ranked, vs Top 10, one-score games, rivalry games, on the road, postseason, against the spread. Nemesis coaches: the game tracks your record against every opposing coach; a coach who owns you shows up in the game hero and a Nemesis storyline, and finally beating him is a moment."}, {"version": "1.102.0", "notes": "Betting lines: the game hero shows the spread and the over/under (built from ratings, form, home field, rivalry heat and your game plan), and the Last result card says whether you covered and whether it went over. Playbook help updated for crunch time, mandates, challenges, bye and bowl weeks and head-to-head co-op."}, {"version": "1.101.0", "notes": "Crunch time tracks timeouts: the offense's remaining timeouts show in the panel and the broadcast, and each one makes the drive a little more likely to score (bleeding the clock in the fourth burns the other side's). What's new card shows the full count of updates since you last played and links to all release notes."}, {"version": "1.100.0", "notes": "Season story: the season recap opens with a written account of your year (the signature win, the loss that stung, the streak, one-possession luck, rivalry trophies, crunch-time record, how the playoff ended)."}, {"version": "1.99.0", "notes": "Replays keep the real broadcast: Watch the replay on your games now shows the exact feed you watched live, with your call lines, crunch time and injuries, instead of a regenerated one. In pass-and-play the other coach in a head-to-head game sees that same broadcast."}, {"version": "1.98.0", "notes": "Selection Sunday card on Home in Week 16: your seed, bye or first-round opponent, top seeds and the first four out. Final broadcast lines now name the stakes: conference champions, who advances in the playoff, bowl trophies, national champions."}, {"version": "1.97.0", "notes": "Postseason games are now live: the conference title game, every playoff round and your bowl game play out in the broadcast with halftime, fourth-quarter and crunch-time calls (they were simulated silently before). Bowl week: pick what the trip is for (business trip, let them enjoy it, play the young guys, showcase the stars). What's new card is compact with expandable notes. Commitment announcements from four- and five-stars come with hat ceremonies and live streams. Your agent now points at jobs already opened by midseason firings."}, {"version": "1.96.0", "notes": "Midseason firings: programs that are 1-6 in October now fire their coach and name an interim. It hits the newswire, the Hot seat index marks the job as open with the interim tag, and the winter carousel fills it (an interim who wins can keep the job). Fired coaches enter the rehire pool."}, {"version": "1.95.0", "notes": "Rivalry week guarantee: a veteran goes on local radio and guarantees a win. Let it ride (juice for both locker rooms, and the result follows him), walk it back at the podium, or bench him a quarter. Win probability charts now also show on replays of any game. The Home AD goals card shows your mandate and seasons left. Top 25 lists teams also receiving votes."}, {"version": "1.94.0", "notes": "Post-game win probability chart: after the final, the live card draws how your win chance moved through the game, with scoring plays marked and quarter lines. Crunch-time wording fixed for one- and two-point games (a field goal wins it, not ties it)."}, {"version": "1.93.0", "notes": "Pass-and-play head-to-head: when two coaches on the same device play each other, both make the calls. The halftime panel takes the first coach's call, then says pass the device and takes the other coach's, same at the fourth-quarter break, and in crunch time the coach with the ball picks the offense while the other picks the defense. Both sets of calls shape the result. Also fixed a scoring edge case where stacked aggressive calls could produce absurd totals."}, {"version": "1.92.0", "notes": "What's new: Home shows the updates shipped since you last played, with a Got it button; full release notes live under Program > Save and settings. Rain games can now have a lightning delay."}, {"version": "1.91.0", "notes": "Challenges: start a dynasty as a Rebuild (prestige 4 or less, four years to reach the postseason), Title or bust (blue blood, win it all in three seasons), Giant killer (Group of Five school, make the playoff in five) or Hot seat (inherit two losing seasons and a seat at 65). Each sets the AD mandate, contract and seat to match, with a Pick a school for me button. Challenge shows on your coach card. Site copy updated for crunch time, handoff screen, mandates and the title race."}, {"version": "1.90.0", "notes": "Bye week focus: on an open Saturday you choose what the week is for. Self-scout (+5 edge next game), heal up (every injured player gets a week back, no pads), hit the road (+12 recruiting hours) or a development week (young players get reps, some take a step). Crunch-time field goals now depend on your kicker, and a miss is narrated. Last result card lists all your calls (half, fourth, crunch)."}, {"version": "1.89.0", "notes": "Halftime training room: sometimes a starter is banged up at the half. Play him (he may be fine, he may go down for good and miss weeks) or sit him (the backup steps in, the edge drops, the player stays healthy). Injury-prone and workhorse traits matter. The broadcast narrates whichever way it goes."}, {"version": "1.88.0", "notes": "Pass and play: a handoff screen now appears when the game passes to the next coach (Pass the device to Coach B), so nobody sees the other sideline's screen. Coach profile tracks your crunch-time record."}, {"version": "1.87.0", "notes": "Crunch time: when a game is within one score at the two-minute mark, the broadcast stops and you make the last call. With the ball: air it out, work the sideline, or set up the kick. On defense: prevent, bring pressure, or base. Outcomes depend on your quarterback, your coaching, the matchup and the opposing coach's habits. Two-point tries, onside kicks, walk-off field goals and overtime all flow from it, and the box score matches the broadcast. Works in pass-and-play and online leagues."}, {"version": "1.86.0", "notes": "Conference title race: standings now mark who has clinched a title-game spot, who controls their own destiny and who is eliminated, with a legend. A Conference race card on Home from Week 6 on tells you exactly where you stand (clinched, in control, alive but need help, out), and the feed fires when you clinch, when you are eliminated, and on win-and-in weeks."}, {"version": "1.85.0", "notes": "AD mandates: every coach now carries a stated goal from the athletic director (make a bowl, finish ranked, win the conference, make the playoff, win it all) with a deadline. Meeting it adds a year to your deal and settles the boosters; missing it heats the seat and the AD starts taking calls. Shown on your coach card in Program with seasons left. Hot news items now survive longer in the feed."}, {"version": "1.84.0", "notes": "Around the Country score tiles are now watchable: tap any ranked game for a replay with the drive feed and field strip, built from both rosters. Heisman moments: when a top candidate of yours scores big in a big game, the broadcast says so. Rivalry finals name the right trophy."}, {"version": "1.83.0", "notes": "Redshirts. Open a true freshman's card by week 4 and sit him for the year: he does not burn eligibility, comes back a redshirt freshman with a development bump, and stays off the depth chart until then. RS tags on the roster."}, {"version": "1.82.0", "notes": "The other sideline makes fourth-quarter calls too (gamblers go for it when trailing, old-school coaches run out the clock, schemers save something). Every player on your roster now keeps a game log for the season: open a player card and expand it to see his line from every game."}, {"version": "1.81.0", "notes": "Game plan gets a Feature row: force-feed one back or receiver for more touches (and a Heisman case) at the cost of a little more wear and tear. His carries and targets climb, the backup's shrink."}];
const REAL_RIVALRIES=[];
function seedRivalries(){const byName={};G.teams.forEach(t=>byName[t.name]=t);let seeded=0;REAL_RIVALRIES.forEach(([a,b,n])=>{if(byName[a]&&byName[b])seeded++;const ta=byName[a],tb=byName[b];if(!ta||!tb)return;const r=rivalry(ta.id,tb.id,true);if(r.name)return;r.name=n;r.born='historic';r.heat=rint(55,78);r.trophy=/Cup|Trophy|Bell|Boot|Axe|Bucket|Cannon|Can$|Skillet|Shillelagh|Belt|Bricks|Rosedale/.test(n)?('the '+n.replace(/^the /i,'')):null;const wa=rint(20,60),wb=rint(20,60);r.w[ta.id]=wa;r.w[tb.id]=wb;});
  if(seeded<10){Object.keys(CONFS).forEach(c=>{if(c==='IND')return;const mem=G.teams.filter(t=>t.conf===c).sort((a,b)=>b.prestige-a.prestige);const pairs=[[0,1],[2,3],[4,5]];pairs.forEach(([i,j])=>{if(!mem[i]||!mem[j]||Math.random()<0.25)return;const r=rivalry(mem[i].id,mem[j].id,true);if(r.name)return;r.name=rivName(mem[i].id,mem[j].id);r.born='historic';r.heat=rint(50,72);r.trophy=rivTrophy();r.w[mem[i].id]=rint(15,50);r.w[mem[j].id]=rint(15,50);});});}
  G.teams.forEach(t=>{const same=G.teams.filter(x=>x.id!==t.id&&x.conf===t.conf&&x.region===t.region&&!G.riv[rkey(t.id,x.id)]);if(same.length&&Math.random()<0.6){const x=pick(same);const r=rivalry(t.id,x.id,true);r.heat=rint(12,38);}});}
function rivDecay(){Object.keys(G.riv).forEach(k=>{const r=G.riv[k];r.heat=clamp(r.heat-(r.lastSeason<G.season?10:(r.name?7:3)),0,100);if(r.heat<=0&&!r.name)delete G.riv[k];if(r.name&&r.heat<35){const mine=isHuman(r.a)||isHuman(r.b);newsAll(`${r.name} has gone cold. ${T(r.a).name} and ${T(r.b).name} have not given it a reason to matter lately.`,mine);r.name='';r.born=null;}});}
function myRivals(){const u=G.user;return Object.values(G.riv).filter(r=>(r.a===u||r.b===u)&&r.heat>=35).sort((x,y)=>y.heat-x.heat);}
function gameRiv(g){const r=G.riv[rkey(g.home,g.away)];if(g.played&&g.rivPre){const p=g.rivPre;return p.heat>=35||p.name?Object.assign({a:Math.min(g.home,g.away),b:Math.max(g.home,g.away),games:[]},p):null;}return r&&r.heat>=35?r:null;}

/*show is global*/const COACH_KEYS=['coach','hours','hoursMax','nil','budget','staff','market','mediaLeft','adLobbied','boosterUsed','lastResult','summary','portalAdds','pendingTeam','app','presser','pressLog','offers','fired','plan','contract','losingRun','startPrestige','seatHigh','goals','talks','lameDuck','tipsSeen','guideOff','eventLog','event','_eventFx','eventsThisSeason','eventSeen','schedOffers','schedPicks','hhDue','signing','spring','battles','springBoost','pendingScandal','realign','_optP','waverSeen','news','history','ready','draft','fallout','_pre','ripLog','boosters','nilAsks','edgeOnce','listening','tree','pledge','promo','grudges','mandate','raceSt','byeFocus','challenge','_oppJuice','_guar','bowlFocus','tenures','_lastTenure','ceremonies','heisSeen','captains','vow','confPick','_talk','_rush','bowlPick'];
const REC_KEYS=['offer','texted','convo','pitched','visited','visitQ','visitNote','nilGiven','promise','scouted','inWk','inSeen','waver','heldFly','heldFam','lostWhy','finalOdds','flipped'];
function isHuman(id){return !!G&&(id===G.user||!!(G.h&&G.h[id]));}
function humanIds(){if(!G)return [];const ids=[G.user];if(G.h)Object.keys(G.h).forEach(k=>{if(+k!==G.user)ids.push(+k);});return ids;}
function coopOn(){return humanIds().length>1;}
function bagOf(tid){if(!G||tid===G.user)return G;return (G.h&&G.h[tid])||G;}
function recDefaults(r){if(!r.pitched)r.pitched={};if(r.texted==null)r.texted=0;if(r.nilGiven==null)r.nilGiven=0;if(r.offer==null)r.offer=false;if(r.scouted==null)r.scouted=false;if(r.visited==null)r.visited=false;if(r.convo===undefined)r.convo=null;}
function stashCoach(){const tid=G.user;G.h=G.h||{};const bag=G.h[tid]||(G.h[tid]={});COACH_KEYS.forEach(k=>{bag[k]=G[k];});G.recruits.forEach(r=>{const o={};REC_KEYS.forEach(k=>{if(r[k]!==undefined)o[k]=r[k];});(r.h=r.h||{})[tid]=o;});const t=T(tid);if(t){t.coach=t.coach||{};t.coach.n=G.coach.name;t.coach.rep=G.coach.rep;t.coach.seat=G.coach.seat;t.coach.yrs=G.coach.years;t.coach.human=true;}}
function loadCoach(tid){const bag=G.h&&G.h[tid];if(!bag)return false;COACH_KEYS.forEach(k=>{G[k]=bag[k];});G.recruits.forEach(r=>{REC_KEYS.forEach(k=>{delete r[k];});const o=r.h&&r.h[tid];if(o)Object.assign(r,o);recDefaults(r);});G.user=tid;return true;}
function switchCoach(tid){if(!G||tid===G.user||!isHuman(tid))return;stashCoach();loadCoach(tid);}
function forEachCoach(fn){if(!G)return;const cur=G.user;humanIds().forEach(tid=>{switchCoach(tid);fn(tid);});switchCoach(cur);}
function withCoach(tid,fn){if(!isHuman(tid))return;const cur=G.user;switchCoach(tid);fn();switchCoach(cur);}
function withCoachRet(tid,fn){if(!isHuman(tid))return null;const cur=G.user;switchCoach(tid);let r=null;try{r=fn();}finally{switchCoach(cur);}return r;}
function recFlag(r,h,k){if(h===G.user)return r[k];const o=r.h&&r.h[h];return o?o[k]:undefined;}
function setRecFlag(r,h,k,v){if(h===G.user){r[k]=v;return;}r.h=r.h||{};(r.h[h]=r.h[h]||{})[k]=v;}
function commitsOf(tid){return G.recruits.filter(r=>r.committed===tid).length;}
function newsFor(tid,text,hot){if(tid===G.user){news(text,hot);return;}const b=G.h&&G.h[tid];if(!b)return;b.news=b.news||[];b.news.unshift({w:G.week,s:G.season,text,hot:!!hot});if(b.news.length>60)b.news.length=60;}
function newsAll(text,hot){humanIds().forEach(tid=>newsFor(tid,text,hot));}
function coachDefaults(t,name){const pr=t.prestige;return {coach:{name:name||'Coach',rep:pr*6,seat:20,years:1,w:0,l:0,titles:0,playoffs:0,confTitles:0,xp:{rec:0,dev:0,big:0,media:0}},hours:0,hoursMax:0,nil:80+pr*30,budget:Math.round(pr*2),staff:{oc:makeCoord('oc',50+pr*3+rnd(-4,4)),dc:makeCoord('dc',50+pr*3+rnd(-4,4)),rc:makeCoord('rc',50+pr*3+rnd(-4,4))},market:[],mediaLeft:3,adLobbied:false,boosterUsed:false,lastResult:null,summary:null,portalAdds:0,pendingTeam:null,app:{fans:60,locker:60,admin:60,media:55},presser:null,pressLog:[],offers:[],fired:false,plan:{off:'balanced',agg:'standard'},contract:{yrs:4,sal:Math.round((1.5+pr*0.6)*10)/10},losingRun:0,startPrestige:pr,seatHigh:false,goals:null,talks:null,lameDuck:null,tipsSeen:[],guideOff:false,eventLog:[],event:null,_eventFx:null,eventsThisSeason:0,eventSeen:[],schedOffers:null,schedPicks:null,hhDue:[],signing:null,spring:null,battles:[],springBoost:null,pendingScandal:0,realign:null,_optP:null,waverSeen:false,news:[],history:[],ready:false};}
function addCoach(tid,name){if(!G||isHuman(tid))return false;const t=T(tid);if(!t)return false;G.h=G.h||{};stashCoach();const bag=coachDefaults(t,name);G.h[tid]=bag;t.coach={n:bag.coach.name,rep:bag.coach.rep,seat:20,yrs:1,human:true,pr:t.coach?t.coach.pr:undefined};
  // give the new coach a fresh view of the current recruits and current season context

  const rem=G.games.filter(g=>!g.played&&g.type==='reg'&&(g.home===t.id||g.away===t.id)).map(g=>{const home=g.home===t.id;const o=T(home?g.away:g.home);return {o,home,cur:o.rank};});
  const played=rows.length;const sos=played?rows.reduce((a,r)=>a+r.o.elo,0)/played:0;const sosRank=G.teams.map(x=>{const xg=G.games.filter(g=>g.played&&g.type!=='bowl'&&(g.home===x.id||g.away===x.id));return {id:x.id,v:xg.length?xg.reduce((a,g)=>a+T(g.home===x.id?g.away:g.home).elo,0)/xg.length:0};}).sort((a,b)=>b.v-a.v).findIndex(x=>x.id===t.id)+1;
  const q1=rows.filter(r=>r.won&&r.orank<=10).length,q2=rows.filter(r=>r.won&&r.orank>10&&r.orank<=25).length,bad=rows.filter(r=>!r.won&&r.orank>40).length,goodL=rows.filter(r=>!r.won&&r.orank<=10).length;
  return {rows,rem,sosRank,q1,q2,bad,goodL};}
function renderResume(){const u=userTeam();if(G.phase!=='season'||G.week<3)return '';const R=resumeFor(u);const field=projectedField();const inField=field.some(t=>t.id===u.id);const seed=inField?field.indexOf(field.find(t=>t.id===u.id))+1:null;const cut=field[field.length-1];const lead=confLeaders();const autoLead=lead[u.conf]===u.id;
  const verdict=G.week>15?'':inField?(seed<=4?'In the field with a first-round bye as it stands.':`In the field as the ${seed} seed as it stands${autoLead?' (your conference’s auto bid)':''}.`):(u.rank<=16?`Just outside. The last team in is No. ${cut.rank} ${cut.name}; the committee wants a ranked win or a conference title.`:u.rank<=35?'Outside the picture. Run the table and win the conference.':'Not in the conversation this year.');
  const line=r=>`<div class="item" style="padding:6px 0"><div class="res ${r.won?'W':'L'}" style="min-width:34px;text-align:center">${r.won?'W':'L'}</div><div class="grow"><div class="small">${r.orank<=25?'<b>No. '+r.orank+'</b> ':''}${esc(r.o.name)} <span class="tiny muted">${r.home?'home':'away'}${r.cur<=25&&r.cur!==r.orank?' · now No. '+r.cur:''}${r.type==='ccg'?' · title game':r.type==='po'?' · playoff':''}</span></div></div><div class="tiny muted">${r.ms}-${r.os}</div></div>`;

  return `<div class="card sec"><div class="row between"><div class="eyebrow">Your playoff resume</div><span class="tag ${inField?'good':u.rank<=16?'warn':''}">${inField?(seed<=4?'Bye':'Seed '+seed):u.rank<=16?'Bubble':'Out'}</span></div><div class="small" style="margin:4px 0 8px">${verdict}</div>
    <div class="grid2"><div class="stat"><div class="v">${R.q1}<span class="muted" style="font-size:14px"> / ${R.q2}</span></div><div class="k">Top-10 / Top-25 wins</div></div><div class="stat"><div class="v">${R.bad}</div><div class="k">Bad losses (unranked, outside top 40)</div></div><div class="stat"><div class="v">No. ${R.sosRank}</div><div class="k">Strength of schedule</div></div><div class="stat"><div class="v">${u.cw}-${u.cl}</div><div class="k">Conference${autoLead?' · leading':''}</div></div></div>

function playerMood(p){const u=userTeam();const d=depth(u,p.pos,true);const slot=d.indexOf(p);const starter=slot>-1&&slot<STARTERS[p.pos];let m=60;const why=[];

  if(p.inj>0){m-=6;why.push('hurt');}if(p.promise&&!p.promise.resolved){m+=4;why.push('trusting your promise');}if(p.promise&&p.promise.resolved&&p.promise.kept===false){m-=15;why.push('you broke a promise');}

function actTalk(pid,kind){const p=P(pid);if(!p||p.team!==G.user||p.talked===G.week||G.phase!=='season'||!spend(2))return;p.talked=G.week;

function renderPlayerCard(p){const u=userTeam();const M=playerMood(p);const s=p.st;const stats=s&&s.gp?(p.pos==='QB'?[['Comp/Att',`${s.pc}/${s.pa}`],['Pass yds',s.py],['TD/INT',`${s.ptd}/${s.int}`],['Rush yds',s.ry]]:p.pos==='RB'?[['Carries',s.ra],['Rush yds',s.ry],['TD',s.rtd],['Rec',`${s.rec} for ${s.recy}`]]:['WR','TE'].includes(p.pos)?[['Rec',s.rec],['Yds',s.recy],['TD',s.rectd],['Games',s.gp]]:p.pos==='K'?[['FG',`${s.fgm}/${s.fga}`],['Games',s.gp]]:[['Tackles',s.tk],['Sacks',s.sk],['INT',s.dint],['Games',s.gp]]):null;

const WX={snow:{t:'Snow',d:'Snow in the forecast. Ground game weather; the passing game and the kickers suffer.'},rain:{t:'Rain',d:'Rain all afternoon. Wet ball, slick field, turnovers.'},wind:{t:'Wind',d:'Gusts over 20 mph. Deep balls and long field goals get wobbly.'},heat:{t:'Heat',d:'Mid-90s at kickoff. Conditioning shows in the fourth quarter.'},cold:{t:'Bitter cold',d:'Teens at kickoff. Nobody wants to tackle.'}};
function wxFor(g){if(g.wx!==undefined)return g.wx;if(g.type==='po'&&g.round==='f'||g.type==='bowl'){g.wx=null;return null;}const h=T(g.home);const reg=h.region||'SE';const w=g.week;let r=Math.random();let wx=null;const cold=['NE','MW','MA'].includes(reg);if(w>=10&&cold){wx=r<0.14?'snow':r<0.3?'rain':r<0.42?'wind':r<0.5?'cold':null;}else if(w<=3&&['SE','SW'].includes(reg)){wx=r<0.22?'heat':r<0.34?'rain':null;}else{wx=r<0.12?'rain':r<0.2?'wind':null;}g.wx=wx;return wx;}
function jerseyNight(g){if(!G.hof||!G.hof.length||g.home!==G.user||g.neutral)return null;const u=userTeam();const h=G.hof.find(x=>x.retire===G.season&&x.team===u.name);if(!h)return null;const first=G.games.filter(x=>x.home===u.id&&!x.neutral&&x.week>=2&&x.week<=14).sort((a,b)=>a.week-b.week)[0];return first&&first.id===g.id?h:null;}
function gamedayTags(g){const u=userTeam();const out=[];if(g.home===u.id&&!g.neutral&&(u.soStreak||0)>=3)out.push({t:`Sellout streak: ${u.soStreak}`});if(G.show&&G.show.gid===g.id)out.push({t:'Pregame show on campus',hot:true});{const j=jerseyNight(g);if(j)out.push({t:`${j.n}'s number retired tonight`,hot:true});}const home=g.home===u.id;const R=gameRiv(g);if(R&&R.name)out.push({t:'Rivalry week',hot:true});else if(R&&R.heat>=50)out.push({t:'Bad blood',hot:true});if(g.hc===u.id)out.push({t:'Homecoming'});if(g.sd===u.id)out.push({t:'Senior Day'});if(g.conf&&!G.games.some(x=>x.played&&x.conf&&(x.home===u.id||x.away===u.id)))out.push({t:'Conference opener'});const o=T(home?g.away:g.home);if(u.rank<=25&&o.rank<=25)out.push({t:'Ranked matchup',hot:true});{const rv=starters().find(p=>p.fromTeam===o.name);if(rv)out.push({t:`${rv.pos} ${rv.n} faces his old team`,hot:true});}if(o.coach&&o.coach.tree&&o.coach.tree.own===u.id)out.push({t:`Former ${o.coach.tree.role==='oc'?'OC':o.coach.tree.role==='dc'?'DC':'assistant'} ${o.coach.n} on the other sideline`,hot:true});if(home){const cf=crowdFor(g);out.push({t:`${cf.crowd},000 expected`});if(cf.sellout)out.push({t:'Sellout'});const he=homeEdge(u);out.push({t:he>=75?'Home field: electric':he>=60?'Home field: solid':'Home field: quiet'});}else if(!g.neutral){out.push({t:'Hostile crowd'});}if(G.week===14&&!g.conf)out.push({t:'Regular-season finale'});{const wx=wxFor(g);if(wx)out.push({t:WX[wx].t,wx:true});}if(G.promo&&G.promo.s===G.season&&G.promo.gid===g.id)out.push({t:G.promo.t,hot:true});return out;}

  forEachCoach(nilAsks);

function spend(h){if(G.hours<h)return false;G.hours-=h;return true;}

const dgain=v=>v*(G.diff==='brutal'?0.65:G.diff==='hard'?0.82:1)*(1+(staffBonus().rc-60)/150+coachLevel('rec')*0.03);
function actCall(rec){if(!rec.offer||rec.committed!=null||!spend(3))return;rec.interest[G.user]+=dgain(4+userTeam().prestige*0.5+rnd(0,2));}

function actCallAll(){let n=0;G.recruits.filter(r=>r.offer&&r.committed==null).sort((a,b)=>myOdds(b)-myOdds(a)).forEach(r=>{if(G.hours>=3){actCall(r);n++;}});if(n)news(`Staff worked the phones: ${n} recruits called.`);}
function actScoutAll(){let n=0;G.recruits.filter(r=>r.offer&&!r.scouted).forEach(r=>{if(G.hours>=2){actScout(r);n++;}});}
function needs(){const u=userTeam();return POS.map(pos=>{const d=depth(u,pos,true);const returning=d.filter(p=>p.yr<3);const st=STARTERS[pos];const q=returning.slice(0,st).reduce((a,p)=>a+p.ovr,0)/st;const commits=G.recruits.filter(r=>r.committed===u.id&&r.pos===pos).length;return {pos,score:(returning.length-st)+commits*0.8+(q-60)/10,returning:returning.length,commits};}).sort((a,b)=>a.score-b.score).slice(0,3).map(x=>x.pos);}
function actText(rec){if(!rec.offer||rec.committed!=null||rec.convo||rec.texted===G.week||!spend(2))return;const pool=TEXTS[rec.persona]||TEXTS.quiet;const t=pool[(rec.texted||0)%pool.length>=0?rint(0,pool.length-1):0];rec.convo={m:t.m,r:t.r.map(x=>({t:x.t,v:x.v})),done:false,stamp:`${weekLabel(G.week)} · ${pick(['Mon','Tue','Wed','Thu'])} ${rint(3,9)}:${String(rint(0,59)).padStart(2,'0')} PM`};rec.texted=G.week;}
function actReply(rec,idx){const c=rec.convo;if(!c||c.done)return;const r=c.r[idx];if(!r)return;const u=userTeam();const gain=r.v>=2?6+u.prestige*0.6+rnd(0,3):r.v>=1?3+rnd(0,2):r.v===0?1:r.v===-1?-2:-5;rec.interest[u.id]=Math.max(0,(rec.interest[u.id]||0)+dgain(gain*(hasPerk('livingroom')&&rec.persona==='family'?1.25:1)));if(r.v>=2&&(rec.persona==='confident'||rec.persona==='competitor')&&/guy|job|first call|build around/i.test(r.t)&&!rec.promise)rec.promise='start';if(r.promise&&!rec.promise)rec.promise='start';c.done=true;c.picked=idx;c.reply=r.v>=2?(rec.persona==='quiet'?'\ud83d\udc4d':rec.persona==='confident'?'thats what i like to hear':rec.persona==='family'?'ok. my mom says thank you':rec.persona==='business'?'appreciate the straight answer':'bet. see you saturday'):r.v>=1?'ok cool':r.v===0?'ok':r.v===-1?'hm. ok':(rec.persona==='family'?'...':'wow ok');}
function actVisitStart(rec){if(!rec.offer||rec.committed!=null||rec.visited||rec.visitQ||!spend(hasPerk('roadwarrior')?7:10))return;const key=rec.wants[0];const q=FAMILYQ[key]||FAMILYQ.coach;rec.visitQ={key,q:q.q,a:q.a.map(x=>({t:x.t,v:x.v}))};}
function actVisitAnswer(rec,idx){const vq=rec.visitQ;if(!vq)return;const a=vq.a[idx];if(!a)return;rec.visited=true;rec.visitQ=null;rec.visitWk=G.week;const u=userTeam();const base=16+u.facilities*0.6+(G.lastResult&&G.lastResult.won?8:0)+(u.rank<=25?4:0)+(G.promo&&G.promo.s===G.season&&G.promo.w===G.week?5:0);const mult=a.v>=2?1.4:a.v>=1?1.1:a.v===0?0.9:a.v===-1?0.6:0.3;rec.interest[u.id]=Math.max(0,(rec.interest[u.id]||0)+dgain(base*mult*(hasPerk('livingroom')&&rec.persona==='family'?1.25:1)));rec.visitNote=a.v>=2?'The family left smiling.':a.v>=1?'A good day, no fireworks.':a.v===0?'Polite. Hard to read.':a.v===-1?'That answer sat badly at dinner.':'The visit ended early.';}

function confRace(conf){

    out[t.id]=aboveWorst<2?'clinch':aboveBest>=2?'out':aboveBestWin<2?'control':'alive';});
  return out;
}

  <details><summary>The week</summary><p class="small">Set the game plan (offense, defense, tempo, practice focus, a once-a-season promo for home games), spend hours on recruits, answer any midweek decision, then sim. Your game plays live. In big games it opens in the locker room with your pregame speech. Then at halftime (where a banged-up starter may also be your call), again if it is close going to the fourth, and at the two-minute mark of a one-score game, the broadcast stops and you make the call, with your coordinator's advice on screen (keys 1 to 5 work on desktop). Bold calls that win earn big-game XP. Conference title games, playoff rounds and bowls are live too. On a bye you choose what the week is for; in bowl week you set the trip. After the final: press conference, fallout, the Saturday wrap, the newswire, and a win probability chart on the replay.</p></details>

  <details><summary>Roster</summary><p class="small">Two-deep shows starters and the next man up with each unit's national rank. Pin players to override ratings. Talk to players (hours) to fix moods, keep promises, or clear the air. After the regular season the portal window lists who plans to leave; one conversation each. Redshirt a true freshman by week 4 to bank a year of eligibility and a development bump. Position changes in the offseason. Walk-ons fill gaps at camp. Every player keeps a game log.</p></details>
  <details><summary>Program</summary><p class="small">The AD hands you a mandate with a deadline (make a bowl, finish ranked, win the conference, make the playoff, win it all): meet it and your deal grows, miss it and the seat heats. Challenges on the start screen set a harder version. In Week 1 you name captains. Set ticket prices and your game-day look here, and when you are done, retire into a legacy page. Approval (fans, locker room, admin, media) drives your seat, job offers and who transfers. Coach XP unlocks perks at levels 2 and 4. Budget comes from prestige, the gate, bowls and the playoff; spend it on facilities, the stadium, staff or the NIL collective. Boosters and the AD can be lobbied weekly. Media days: promise something in week 1 and cash it or wear it in December. Your coaching tree follows assistants to their head jobs.</p></details>
  <details><summary>Offseason</summary><p class="small">Work the calendar top to bottom: departures and the draft, coaching staff, NIL retention asks, late signing period, the portal, the spring game, the schedule builder, the budget, the roster limit. Realignment can knock. Camp opens when the roster is legal.</p></details>
  <details><summary>Rivalries, weather, the league</summary><p class="small">Historic rivalries ship named; new ones are earned through heat (ranked matchups, close finishes, upsets, revenge). Named rivalries get a protected late-season slot and trophies. Late-season northern games bring snow, rain, wind and cold; September in the South brings heat, and your plan matters in it. The league runs itself: coaching carousel, hot seat index, way-too-early polls, a hall of fame and jersey retirements.</p></details>
  <details><summary>Co-op</summary><p class="small">Pass and play on one device from the Program tab, or an online league from the start screen (needs a league server). Every coach plays their own game live, then readies up; a handoff screen covers the device between coaches and the week advances when everyone has. When two coaches play each other on one device, both make the calls (pass the device at halftime and the fourth; the coach with the ball picks the offense in crunch time, the other picks the defense). The league table on Home tracks records, class ranks, seats and head-to-head.</p></details>
  <details><summary>Keys and gestures</summary><p class="small">Desktop: 1 to 6 jump to tabs, left and right arrows move between them, Escape closes an open player or recruit. Phone: swipe left or right between tabs. Live speed is on the live card.</p></details></div>`;
  return talks+coach+offers+profile+lookCard+staff+press+lobby+renderBoosters()+budget+ident+pros+hist+trophies+achs+manual+league+coop+danger;
}
